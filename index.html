<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050508"
  >

  <meta
    name="color-scheme"
    content="dark"
  >

  <meta
    name="description"
    content="CrowRules Entertainment administrative command center."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>CrowRules Admin | Command Center</title>

  <!-- =========================================================
       CROWRULES ADMIN STYLES
       ========================================================= -->

  <link
    rel="stylesheet"
    href="assets/admin.css"
  >

  <!-- =========================================================
       GOOGLE FONTS
       ========================================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800&display=swap"

  >

  <!-- =========================================================
       SUPABASE JAVASCRIPT CLIENT

       IMPORTANT:
       This is the browser-safe Supabase client.

       NEVER put:
       - service_role key
       - secret key
       - database password

       in this file.
       ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"
  ></script>

</head>

<body>

  <!-- =========================================================
       CROWRULES ADMIN COMMAND CENTER
       ========================================================= -->

  <main
    id="app"
    role="main"

    <noscript>

      <section
        style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:2rem;
          background:#050508;
          color:#fff;
          font-family:Arial,sans-serif;
          text-align:center;
        "
      >

        <div>

          <h1>
            CrowRules Admin
          </h1>

          <p>
            JavaScript is required to operate the
            CrowRules administrative command center.
          </p>

          <p>
            Please enable JavaScript and reload this page.
          </p>

        </div>

      </section>

    </noscript>

  </main>

  <!-- =========================================================
       CROWRULES ADMIN APPLICATION
       ========================================================= -->

  <script
    src="assets/admin.js"
    defer
  ></script>

</html>
