<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#05070b">
<meta name="description" content="CrowRules Entertainment Admin v5.3 — Advanced Supabase Administration">
<title>CrowRules Admin v5.3 — Advanced Data Grid</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#05070b;
  --panel:#0b1018;
  --panel2:#101722;
  --panel3:#151d29;
  --line:#263142;
  --text:#eef4ff;
  --muted:#91a0b5;
  --accent:#00d9ff;
  --accent2:#7c5cff;
  --green:#25e58a;
  --yellow:#ffd166;
  --red:#ff5470;
  --orange:#ff9f43;
  --shadow:0 20px 60px rgba(0,0,0,.35);
  --radius:16px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:
    radial-gradient(circle at 10% 0%,rgba(0,217,255,.08),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(124,92,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   BOOT / LOGIN
========================================================= */

#bootScreen,
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.boot-card,
.login-card{
  width:min(520px,100%);
  background:rgba(11,16,24,.94);
  border:1px solid var(--line);
  border-radius:24px;
  padding:36px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
}

.brand-mark{
  width:70px;
  height:70px;
  display:grid;
  place-items:center;
  border-radius:20px;
  margin-bottom:22px;
  background:
    linear-gradient(135deg,rgba(0,217,255,.2),rgba(124,92,255,.2));
  border:1px solid rgba(0,217,255,.35);
  font-size:32px;
}

h1,h2,h3,h4{
  margin-top:0;
}

.brand-title{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand-subtitle{
  color:var(--muted);
  margin-top:7px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#cbd6e7;
  font-size:13px;
  font-weight:700;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#070b11;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px 13px;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,217,255,.1);
}

.btn{
  border:1px solid var(--line);
  background:var(--panel3);
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
  font-weight:750;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#3c4b62;
}

.btn-primary{
  background:linear-gradient(135deg,#00b9d9,#6750df);
  border-color:transparent;
}

.btn-success{
  background:rgba(37,229,138,.12);
  color:var(--green);
  border-color:rgba(37,229,138,.25);
}

.btn-danger{
  background:rgba(255,84,112,.12);
  color:#ff8da0;
  border-color:rgba(255,84,112,.25);
}

.btn-warning{
  background:rgba(255,209,102,.1);
  color:var(--yellow);
  border-color:rgba(255,209,102,.25);
}

.btn-small{
  padding:7px 10px;
  font-size:12px;
}

.login-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.login-actions .btn{
  flex:1;
}

.status{
  margin-top:15px;
  min-height:20px;
  color:var(--muted);
  font-size:13px;
}

.status.error{
  color:#ff8da0;
}

.status.success{
  color:var(--green);
}

/* =========================================================
   APP
========================================================= */

#app{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}

.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  padding:20px;
  background:rgba(7,11,17,.95);
  border-right:1px solid var(--line);
  overflow:auto;
}

.sidebar-brand{
  padding:10px 8px 22px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

.sidebar-brand strong{
  display:block;
  font-size:18px;
}

.sidebar-brand span{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.nav-group{
  margin-bottom:20px;
}

.nav-label{
  padding:8px 10px;
  color:#627086;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  color:#aebbd0;
  padding:10px 11px;
  margin:2px 0;
  border-radius:10px;
  text-align:left;
}

.nav-btn:hover,
.nav-btn.active{
  color:white;
  background:rgba(0,217,255,.09);
}

.main{
  min-width:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:14px 24px;
  background:rgba(5,7,11,.82);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}

.topbar-title{
  font-size:18px;
  font-weight:850;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.role-badge{
  padding:6px 10px;
  border-radius:999px;
  background:rgba(124,92,255,.12);
  border:1px solid rgba(124,92,255,.3);
  color:#bbaeff;
  font-size:11px;
  font-weight:900;
}

.content{
  padding:24px;
}

/* =========================================================
   CARDS / STATS
========================================================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:14px;
  margin-bottom:20px;
}

.stat-card{
  background:linear-gradient(180deg,rgba(16,23,34,.98),rgba(9,13,20,.98));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
}

.stat-value{
  font-size:30px;
  font-weight:900;
  margin-top:8px;
}

.stat-note{
  margin-top:5px;
  color:#627086;
  font-size:11px;
}

.panel{
  background:rgba(11,16,24,.9);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:18px;
}

.panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.panel-title{
  font-size:16px;
  font-weight:850;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.search{
  min-width:240px;
  background:#070b11;
  color:white;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  outline:none;
}

.search:focus{
  border-color:var(--accent);
}

/* =========================================================
   TABLE DIRECTORY
========================================================= */

.table-directory{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:12px;
}

.table-card{
  padding:16px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0a0f17;
  transition:.15s;
}

.table-card:hover{
  border-color:#3b4c64;
  transform:translateY(-1px);
}

.table-name{
  font-weight:850;
  word-break:break-word;
}

.table-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}

.table-card-actions{
  display:flex;
  gap:7px;
  margin-top:13px;
}

/* =========================================================
   DATA GRID
========================================================= */

.grid-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px;
  background:#070b11;
}

.data-grid{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

.data-grid th{
  position:sticky;
  top:0;
  z-index:2;
  background:#111925;
  border-bottom:1px solid var(--line);
  padding:0;
  white-space:nowrap;
}

.data-grid th button{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px;
  background:transparent;
  color:#dce7f6;
  border:0;
  font-weight:850;
  text-align:left;
}

.data-grid th button:hover{
  background:rgba(0,217,255,.06);
}

.data-grid td{
  border-bottom:1px solid rgba(38,49,66,.65);
  padding:10px 12px;
  vertical-align:top;
  max-width:300px;
}

.data-grid tr:hover td{
  background:rgba(255,255,255,.015);
}

.cell{
  max-width:280px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.cell.null{
  color:#556277;
  font-style:italic;
}

.select-cell{
  width:40px;
  text-align:center;
}

.row-actions{
  display:flex;
  gap:5px;
  white-space:nowrap;
}

/* =========================================================
   FILTERS / PAGINATION
========================================================= */

.grid-controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.pagination{
  display:flex;
  align-items:center;
  gap:7px;
}

.page-info{
  color:var(--muted);
  font-size:12px;
  min-width:130px;
  text-align:center;
}

.page-size{
  width:85px;
  background:#070b11;
  color:white;
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0b1018;
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
}

.modal-header{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  background:#0b1018;
  border-bottom:1px solid var(--line);
}

.modal-body{
  padding:18px;
}

.modal-footer{
  position:sticky;
  bottom:0;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:15px 18px;
  background:#0b1018;
  border-top:1px solid var(--line);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.form-grid .full{
  grid-column:1/-1;
}

.record-field{
  border:1px solid var(--line);
  background:#080d14;
  border-radius:11px;
  padding:12px;
}

.record-field label{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
  font-size:12px;
  font-weight:800;
}

.record-field small{
  color:#65748a;
  font-weight:500;
}

.record-field textarea{
  min-height:100px;
  resize:vertical;
}

.json-editor{
  width:100%;
  min-height:350px;
  background:#05080d;
  color:#dff7ff;
  border:1px solid var(--line);
  border-radius:11px;
  padding:14px;
  font-family:Consolas,monospace;
  font-size:13px;
}

/* =========================================================
   IMPORT / EXPORT
========================================================= */

.drop-zone{
  border:2px dashed #334158;
  border-radius:14px;
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.drop-zone.dragover{
  border-color:var(--accent);
  background:rgba(0,217,255,.04);
}

.import-options{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

/* =========================================================
   SCHEMA MAP
========================================================= */

.schema-map{
  position:relative;
  min-height:620px;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    #060a10;
  background-size:30px 30px;
}

.schema-canvas{
  position:relative;
  width:1800px;
  min-height:1000px;
}

.schema-node{
  position:absolute;
  width:210px;
  background:#0d141f;
  border:1px solid #334158;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  overflow:hidden;
}

.schema-node-header{
  padding:10px 12px;
  background:#131d2b;
  font-weight:900;
  font-size:12px;
  border-bottom:1px solid var(--line);
}

.schema-column{
  display:flex;
  justify-content:space-between;
  gap:7px;
  padding:5px 10px;
  font-size:10px;
  border-bottom:1px solid rgba(38,49,66,.45);
}

.schema-column:last-child{
  border-bottom:0;
}

.schema-column span:last-child{
  color:#718096;
}

.schema-svg{
  position:absolute;
  inset:0;
  width:1800px;
  height:1000px;
  pointer-events:none;
}

.schema-line{
  stroke:rgba(0,217,255,.45);
  stroke-width:1.5;
  fill:none;
}

/* =========================================================
   AUDIT / DIAGNOSTICS
========================================================= */

.audit-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.audit-item{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  background:#080d14;
}

.audit-item strong{
  font-size:12px;
}

.audit-item span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

/* =========================================================
   TOAST
========================================================= */

#toastContainer{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:300;
  display:flex;
  flex-direction:column;
  gap:8px;
  width:min(390px,calc(100vw - 40px));
}

.toast{
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0c131d;
  box-shadow:var(--shadow);
  font-size:13px;
}

.toast.success{
  border-color:rgba(37,229,138,.35);
}

.toast.error{
  border-color:rgba(255,84,112,.4);
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-menu{
  display:none;
}

@media(max-width:1100px){
  .stats-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:800px){
  #app{
    display:block;
  }

  .sidebar{
    position:fixed;
    left:-280px;
    z-index:80;
    width:260px;
    transition:.2s;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:inline-flex;
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .content{
    padding:15px;
  }

  .topbar{
    padding:12px 15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-grid .full{
    grid-column:auto;
  }
}

@media(max-width:500px){
  .stats-grid{
    grid-template-columns:1fr;
  }

  .login-card,
  .boot-card{
    padding:25px;
  }

  .search{
    min-width:100%;
  }
}
</style>
</head>

<body>

<!-- ========================================================
     BOOT
========================================================= -->

<section id="bootScreen">
  <div class="boot-card">
    <div class="brand-mark">🐦‍⬛</div>
    <div class="brand-title">CrowRules Admin</div>
    <div class="brand-subtitle">
      v5.3 Advanced Supabase Data Grid
    </div>

    <div id="bootStatus" class="status">
      Initializing secure administration system…
    </div>
  </div>
</section>

<!-- ========================================================
     LOGIN
========================================================= -->

<section id="loginScreen" class="hidden">
  <div class="login-card">

    <div class="brand-mark">🐦‍⬛</div>

    <div class="brand-title">
      CrowRules Admin v5.3
    </div>

    <div class="brand-subtitle">
      Secure Supabase Command Center
    </div>

    <form id="loginForm" style="margin-top:25px">

      <div class="field">
        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="Admin email"
          required
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
        >
      </div>

      <div class="login-actions">
        <button class="btn btn-primary" type="submit">
          Sign In
        </button>

        <button
          class="btn"
          type="button"
          id="resetPasswordBtn"
        >
          Reset Password
        </button>
      </div>

      <div id="loginStatus" class="status"></div>

    </form>

  </div>
</section>

<!-- ========================================================
     APPLICATION
========================================================= -->

<section id="app" class="hidden">

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-brand">
      <strong>🐦‍⬛ CrowRules Admin</strong>
      <span>Advanced Data Grid v5.3</span>
    </div>

    <div class="nav-group">

      <div class="nav-label">Command</div>

      <button class="nav-btn active" data-view="dashboard">
        📊 Overview
      </button>

      <button class="nav-btn" data-view="tables">
        🗄️ Database
      </button>

      <button class="nav-btn" data-view="stats">
        📈 Statistics
      </button>

      <button class="nav-btn" data-view="schema">
        🔗 Schema Map
      </button>

    </div>

    <div class="nav-group">

      <div class="nav-label">Administration</div>

      <button class="nav-btn" data-view="permissions">
        🔐 Permissions
      </button>

      <button class="nav-btn" data-view="audit">
        📝 Audit
      </button>

      <button class="nav-btn" data-view="diagnostics">
        ❤️ Diagnostics
      </button>

    </div>

    <div class="nav-group">

      <div class="nav-label">Platform</div>

      <button class="nav-btn" data-view="modules">
        🧩 Modules
      </button>

      <button class="nav-btn" data-view="backup">
        💾 Backup / Export
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:10px">

        <button
          id="mobileMenuBtn"
          class="btn mobile-menu"
        >
          ☰
        </button>

        <div>
          <div id="topTitle" class="topbar-title">
            CrowRules Command Center
          </div>

          <div
            id="topSubtitle"
            style="font-size:11px;color:var(--muted)"
          >
            Supabase Administration
          </div>
        </div>

      </div>

      <div class="topbar-right">

        <span id="roleBadge" class="role-badge">
          Checking…
        </span>

        <button
          class="btn btn-small"
          id="refreshBtn"
        >
          ↻ Refresh
        </button>

        <button
          class="btn btn-small"
          id="logoutBtn"
        >
          Sign Out
        </button>

      </div>

    </header>

    <div id="content" class="content"></div>

  </main>

</section>

<!-- ========================================================
     MODAL
========================================================= -->

<div id="modalBackdrop" class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <div>
        <div id="modalTitle" style="font-weight:900">
          Record
        </div>

        <div
          id="modalSubtitle"
          style="font-size:11px;color:var(--muted);margin-top:3px"
        ></div>
      </div>

      <button
        class="btn btn-small"
        id="modalClose"
      >
        ✕
      </button>

    </div>

    <div id="modalBody" class="modal-body"></div>

    <div id="modalFooter" class="modal-footer"></div>

  </div>

</div>

<div id="toastContainer"></div>

<script>
/* =========================================================
   CROWRULES ENTERTAINMENT ADMIN v5.3
   ADVANCED SUPABASE DATA GRID
========================================================= */

"use strict";

/* =========================================================
   CONFIGURATION
========================================================= */

const SUPABASE_URL =
  "https://zauxdqyssratvzmomozf.supabase.co";

/*
  IMPORTANT:
  Use the browser-safe publishable/anon key here.
  NEVER use service_role / secret keys.
*/
const SUPABASE_PUBLISHABLE_KEY =

/* =========================================================
   UTILITIES
========================================================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function pretty(value){

  if(value === null || value === undefined){
    return "NULL";
  }

  if(typeof value === "object"){
    return JSON.stringify(value);
  }

  return String(value);
}

function isObject(value){
  return value &&
    typeof value === "object" &&
    !Array.isArray(value);
}

function toast(message,type=""){

  const el = document.createElement("div");

  el.className = "toast " + type;

  el.textContent = message;

  $("toastContainer").appendChild(el);

  setTimeout(()=>{
    el.remove();
  },4500);
}

function setLoginStatus(message,error=false){

  const el = $("loginStatus");

  el.textContent = message;

  el.className =
    "status " + (error ? "error" : "success");
}

function setBootStatus(message){

  $("bootStatus").textContent = message;
}

function downloadBlob(content,filename,type){

  const blob =
    new Blob([content],{type});

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}

function timestamp(){

  return new Date()
    .toISOString()
    .replaceAll(":","-")
    .replaceAll(".","-");
}

/* =========================================================
   SUPABASE INITIALIZATION
========================================================= */

async function initializeSupabase(){

  if(
    !SUPABASE_URL ||
    !SUPABASE_PUBLISHABLE_KEY ||
    SUPABASE_PUBLISHABLE_KEY ===
      "YOUR_SUPABASE_PUBLISHABLE_KEY"
  ){

    throw new Error(
      "Supabase publishable key has not been configured."
    );
  }

  supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true,
          flowType:"pkce"
        }
      }
    );
}

/* =========================================================
   AUTHORIZATION
========================================================= */

async function authorizeCurrentUser(){

  /*
    STEP 1:
    Restore local Supabase session.
  */

  const {
    data:sessionData,
    error:sessionError
  } =
    await supabase.auth.getSession();

  if(sessionError){
    throw sessionError;
  }

  if(!sessionData?.session){

    throw new Error(
      "Auth session missing. Please sign in."
    );
  }

  /*
    STEP 2:
    Ask Supabase Auth for authoritative user.
  */

  const {
    data:{user},
    error:userError
  } =
    await supabase.auth.getUser();

  if(userError){
    throw userError;
  }

  if(!user){
    throw new Error(
      "Authenticated user could not be verified."
    );
  }

  state.user=user;

  /*
    STEP 3:
    Ask protected CrowRules RPC whether
    this authenticated user is authorized.
  */

  const {
    data,
    error
  } =
    await supabase.rpc(
      "cr_admin_access_check"
    );

  if(error){
    throw new Error(
      "Admin authorization check failed: " +
      error.message
    );
  }

  const admin =
    Array.isArray(data)
      ? data[0]
      : data;

  if(
    !admin ||
    admin.authorized !== true ||
    admin.is_active !== true
  ){

    throw new Error(
      "This authenticated account is not authorized for CrowRules Admin."
    );
  }

  state.admin=admin;

  $("roleBadge").textContent =
    String(admin.role || "admin")
      .replace("_"," ")
      .toUpperCase();

  return admin;
}

/* =========================================================
   LOGIN
========================================================= */

async function login(email,password){

  try{

    setLoginStatus("Signing in…");

    const {
      data,
      error
    } =
      await supabase.auth.signInWithPassword({
        email:email.trim(),
        password
      });

    if(error){
      throw error;
    }

    if(!data?.session){

      throw new Error(
        "Supabase authenticated the request but returned no session."
      );
    }

    /*
      Do NOT immediately trust the response alone.
      Re-check with getUser().
    */

    const {
      data:{user},
      error:userError
    } =
      await supabase.auth.getUser();

    if(userError){
      throw userError;
    }

    if(!user){
      throw new Error(
        "Authenticated user could not be verified."
      );
    }

    state.user=user;

    const {
      data:adminRows,
      error:adminError
    } =
      await supabase.rpc(
        "cr_admin_access_check"
      );

    if(adminError){
      throw adminError;
    }

    const admin =
      Array.isArray(adminRows)
        ? adminRows[0]
        : adminRows;

    if(
      !admin ||
      admin.authorized !== true ||
      admin.is_active !== true
    ){

      throw new Error(
        "This authenticated account is not authorized for CrowRules Admin."
      );
    }

    state.admin=admin;

    setLoginStatus("Authorized. Loading Admin…");

    await enterAdmin();

  }catch(error){

    console.error(error);

    setLoginStatus(
      error.message ||
      "Login failed.",
      true
    );
  }
}

========================================================= */

async function logout(){

  try{

  }catch(error){

  }finally{

    app.classList.add("hidden");
    loginScreen.classList.remove("hidden");

    $("loginPassword").value="";

    setLoginStatus(

}

/* =========================================================

========================================================= */

async function resetPassword(){

  const email =
    $("loginEmail").value.trim();

  if(!email){

    setLoginStatus(
      "Enter your email address first.",
      true
    );

    return;
  }

  try{

    const {
      error
    } =
      await supabase.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.href
        }
      );

    if(error){
      throw error;
    }

    setLoginStatus(
      "Password reset instructions sent."
    );

  }catch(error){

    setLoginStatus(
      error.message,
      true
    );
  }
}

/* =========================================================
   SCHEMA
========================================================= */

async function loadSchema(){

  state.loading=true;

  try{

    const {
      data,
      error
    } =
      await supabase.rpc(
        "cr_admin_schema_metadata"
      );

    if(error){
      throw error;
    }

    state.metadata =
      Array.isArray(data)
        ? data
        : [];

    state.tables =
      state.metadata.map(row=>({

        name:row.table_name,
        type:row.table_type,
        count:Number(row.row_count || 0)

      }));

    /*
      Relationship graph.
    */

    const {
      data:graphData,
      error:graphError
    } =
      await supabase.rpc(
        "cr_admin_schema_graph"
      );

    if(!graphError){

      state.graph=graphData;

    }else{

      console.warn(
        "Schema graph unavailable:",
        graphError
      );

      state.graph={
        tables:[],
        relations:[]
      };
    }

  }catch(error){

    console.error(error);

    toast(
      "Schema loading failed: " +
      error.message,
      "error"
    );

  }finally{

    state.loading=false;
  }
}

/* =========================================================
   TABLE METADATA
========================================================= */

function tableInfo(name){

  return state.tables.find(
    t=>t.name===name
  );
}

function metadataColumns(name){

  const entry =
    state.graph?.tables?.find(
      t=>t.name===name
    );

  /*
    Schema graph only has table names.
    Ask information via the detailed metadata
    fallback RPC when needed.
  */

  return [];
}

/*
  The existing schema metadata RPC returns table counts.
  For form generation, retrieve actual PostgreSQL
  information from the Data API by using a safe
  sample row and derive keys dynamically.
*/

async function getTableColumns(table){

  /*
    First try current rows.
  */

  if(
    state.currentTable === table &&
    state.currentColumns.length
  ){

    return state.currentColumns;
  }

  const {
    data,
    error
  } =
    await supabase.rpc(
      "cr_admin_table_data",
      {
        p_table:table,
        p_limit:1,
        p_offset:0,
        p_order_col:null,
        p_desc:false,
        p_search:null
      }
    );

  if(error){
    throw error;
  }

  const rows =
    Array.isArray(data)
      ? data
      : [];

  if(rows[0]){

    return Object.keys(rows[0]);

  }

  /*
    Empty tables need column metadata.
    Use information schema through a dedicated
    metadata RPC if available.
  */

  const {
    data:metaData,
    error:metaError
  } =
    await supabase.rpc(
      "cr_admin_schema_metadata"
    );

  if(metaError){
    throw metaError;
  }

  /*
    Older metadata RPC only returns counts.
    Return no columns for a truly empty table.
  */

  return [];
}

/* =========================================================
   FETCH TABLE DATA
========================================================= */

async function loadTable(
  table,
  resetPage=true
){

  if(resetPage){
    state.page=0;
  }

  state.currentTable=table;

  try{

    state.loading=true;

    const offset =
      state.page *
      state.pageSize;

    const {
      data,
      error
    } =
      await supabase.rpc(
        "cr_admin_table_data",
        {
          p_table:table,
          p_limit:state.pageSize,
          p_offset:offset,
          p_order_col:state.sortColumn,
          p_desc:state.sortDesc,
          p_search:
            state.search.trim() ||
            null
        }
      );

    if(error){
      throw error;
    }

    state.currentRows =
      Array.isArray(data)
        ? data
        : [];

    /*
      Accurate count.
    */

    const {
      data:count,
      error:countError
    } =
      await supabase.rpc(
        "cr_admin_table_count",
        {
          p_table:table
        }
      );

    if(countError){
      throw countError;
    }

    state.totalRows =
      Number(count || 0);

    if(state.currentRows.length){

      state.currentColumns =
        Object.keys(
          state.currentRows[0]
        );

    }else{

      state.currentColumns=[];
    }

    renderTableView();

  }catch(error){

    console.error(error);

    toast(
      "Table load failed: " +
      error.message,
      "error"
    );

  }finally{

    state.loading=false;
  }
}

        btn.dataset.view===view

  switch(view){

    case "dashboard":
      renderDashboard();
      break;

    case "tables":
      renderTables();
      break;

    case "stats":
      renderStats();
      break;

    case "schema":
      renderSchema();
      break;

    case "permissions":
      renderPermissions();
      break;

    case "audit":
      renderAudit();
      break;

    case "diagnostics":
      renderDiagnostics();
      break;

    case "modules":
      renderModules();
      break;

    case "backup":
      renderBackup();
      break;

    default:
      renderDashboard();
  }
}

/* =========================================================

function sortByColumn(encoded){

      !state.sortDesc;

    state.sortColumn=col;

/* =========================================================
   SEARCH
========================================================= */

function applyRecordSearch(){

  state.search =

      ?.trim() || "";

  state.page=0;

  loadTable(
    state.currentTable,
    false
  );
}

function clearRecordSearch(){

  state.search="";

  state.page=0;

  loadTable(

    false
  );
}

/* =========================================================
   PAGINATION
========================================================= */

function changePageSize(value){

  state.pageSize =
    Number(value);

  state.page=0;

  loadTable(
    state.currentTable,
    false
  );
}

function firstPage(){

  state.page=0;

  loadTable(
    state.currentTable,
    false
  );
}

function previousPage(){

  if(state.page<=0){
    return;
  }

  state.page--;

  loadTable(
    state.currentTable,
    false
  );
}

function nextPage(){

  if(
    (state.page+1)*
    state.pageSize >=
    state.totalRows
  ){
    return;
  }

  state.page++;

  loadTable(
    state.currentTable,
    false
  );
}

function lastPage(){

  state.page =
    Math.max(
      0,
      Math.ceil(
        state.totalRows /
        state.pageSize
      )-1
    );

  loadTable(
    state.currentTable,
    false
  );
}

/* =========================================================
   SELECTION
========================================================= */

function rowIdentity(row){

  /*
    Prefer common primary-key names.
    Otherwise use stable JSON.
  */

  const candidates=[
    "id",
    "user_id",
    "uuid",
    "slug",
    "key"
  ];

  for(const key of candidates){

    if(
      row &&
      row[key] !== undefined &&
      row[key] !== null
    ){

      return key + ":" +
        JSON.stringify(row[key]);
    }
  }

  return "row:" +
    JSON.stringify(row);
}

function isSelected(row){

  return state.selected.has(
    rowIdentity(row)
  );
}

function toggleRowSelection(index,checked){

  const row =
    state.currentRows[index];

  if(!row){
    return;
  }

  const id =
    rowIdentity(row);

  if(checked){
    state.selected.add(id);
  }else{
    state.selected.delete(id);
  }

  renderTableView();
}

function togglePageSelection(checked){

  for(const row of state.currentRows){

    const id =
      rowIdentity(row);

    if(checked){
      state.selected.add(id);
    }else{
      state.selected.delete(id);
    }
  }

  renderTableView();
}

function clearSelection(){

  state.selected.clear();

  renderTableView();
}

/* =========================================================
   PRIMARY KEY EXTRACTION
========================================================= */

function guessPrimaryKey(row){

  if(!row){
    return null;
  }

  const candidates=[
    "id",
    "user_id",
    "uuid",
    "slug",
    "key"
  ];

  for(const key of candidates){

    if(
      Object.prototype.hasOwnProperty.call(
        row,
        key
      )
    ){

      return {
        [key]:row[key]
      };
    }
  }

  return null;
}

/*
  Build key from row using first common PK.
  For tables with composite PKs, the user can
  use JSON editing/import workflows.
*/

function getRowKey(row){

  return guessPrimaryKey(row);
}

/* =========================================================
   SAVE RECORD
========================================================= */

function collectRecordFields(){

  const record={};

  document
    .querySelectorAll(
      "[data-record-field]"
    )
    .forEach(input=>{

      let value =
        input.value;

      const name =
        input.dataset.recordField;

      if(value===""){
        record[name]=null;
        return;
      }

      /*
        Attempt JSON parsing for objects/arrays.
      */

      const trimmed =
        value.trim();

      if(
        (trimmed.startsWith("{") &&
         trimmed.endsWith("}")) ||
        (trimmed.startsWith("[") &&
         trimmed.endsWith("]"))
      ){

        try{
          value=JSON.parse(trimmed);
        }catch{
          /* Keep as string */
        }
      }

      if(value==="true"){
        value=true;
      }else if(value==="false"){
        value=false;
      }

      record[name]=value;
    });

  return record;
}

async function saveRecord(
  mode,
  encodedTable
){

  const table =
    decodeURIComponent(encodedTable);

  const row =
    collectRecordFields();

  try{

    let result;

    if(mode==="insert"){

      const response =
        await supabase.rpc(
          "cr_admin_insert",
          {
            p_table:table,
            p_row:row
          }
        );

      if(response.error){
        throw response.error;
      }

      result=response.data;

    }else{

      const key =
        getRowKey(
          state.currentRows.find(
            r=>Object.keys(r)
              .every(k=>
                String(r[k] ?? "") ===
                String(
                  row[k] ?? ""
                )
              )
          )
        );

      /*
        If key can't be recovered from
        the edited row, ask the user to use
        JSON mode / preserve primary key.
      */

      if(!key){

        throw new Error(
          "Could not determine the primary key. Preserve the record's id/user_id/uuid in JSON mode."
        );
      }

      const response =
        await supabase.rpc(
          "cr_admin_update",
          {
            p_table:table,
            p_key:key,
            p_row:row
          }
        );

      if(response.error){
        throw response.error;
      }

      result=response.data;
    }

    console.log("Mutation result:",result);

    closeModal();

    toast(
      mode==="insert"
        ? "Record created."
        : "Record updated.",
      "success"
    );

    await loadSchema();

    await loadTable(
      table,
      false
    );

  }catch(error){

    console.error(error);

    toast(
      "Save failed: " +
      error.message,
      "error"
    );
  }
}

async function saveJSONRecord(
  mode,
  encodedTable
){

  const table =
    decodeURIComponent(encodedTable);

  try{

    const parsed =
      JSON.parse(
        $("jsonRecordEditor").value
      );

    if(!isObject(parsed)){
      throw new Error(
        "JSON must be an object."
      );
    }

    if(mode==="insert"){

      const {
        error
      } =
        await supabase.rpc(
          "cr_admin_insert",
          {
            p_table:table,
            p_row:parsed
          }
        );

      if(error){
        throw error;
      }

    }else{

      const key =
        getRowKey(parsed);

      if(!key){

        throw new Error(
          "Primary key missing from JSON record."
        );
      }

      const {
        error
      } =
        await supabase.rpc(
          "cr_admin_update",
          {
            p_table:table,
            p_key:key,
            p_row:parsed
          }
        );

      if(error){
        throw error;
      }
    }

    closeModal();

    toast(
      mode==="insert"
        ? "Record created."
        : "Record updated.",
      "success"
    );

    await loadSchema();

    await loadTable(
      table,
      false
    );

  }catch(error){

    toast(
      "JSON save failed: " +
      error.message,
      "error"
    );
  }
}

/* =========================================================
   DELETE
========================================================= */

async function deleteRow(index){

  const row =
    state.currentRows[index];

  if(!row){
    return;
  }

  const key =
    getRowKey(row);

  if(!key){

    toast(
      "No supported primary key found for this record.",
      "error"
    );

    return;
  }

  if(
    !confirm(
      "Delete this record permanently?"
    )
  ){
    return;
  }

  try{

    const {
      error
    } =
      await supabase.rpc(
        "cr_admin_delete",
        {
          p_table:state.currentTable,
          p_key:key
        }
      );

    if(error){
      throw error;
    }

    toast(
      "Record deleted.",
      "success"
    );

    state.selected.delete(
      rowIdentity(row)
    );

    await loadSchema();

    await loadTable(
      state.currentTable,
      false
    );

  }catch(error){

    toast(
      "Delete failed: " +
      error.message,
      "error"
    );
  }
}

/* =========================================================
   DUPLICATE
========================================================= */

async function duplicateRow(index){

  const row =
    state.currentRows[index];

  if(!row){
    return;
  }

  const duplicate =
    JSON.parse(
      JSON.stringify(row)
    );

  /*
    Remove common generated identity fields.
  */

  [
    "id",
    "uuid",
    "created_at",
    "updated_at"
  ].forEach(key=>{

    if(
      Object.prototype.hasOwnProperty.call(
        duplicate,
        key
      )
    ){

      delete duplicate[key];
    }

  });

  openRecordModal(
    "insert",
    state.currentTable,
    duplicate
  );
}

/* =========================================================
   BULK DELETE
========================================================= */

async function bulkDelete(){

  if(!state.selected.size){
    return;
  }

  if(
    !confirm(
      `Delete ${state.selected.size} selected records permanently?`
    )
  ){
    return;
  }

  /*
    Resolve selected current-page rows.
  */

  const rows =
    state.currentRows.filter(
      row=>state.selected.has(
        rowIdentity(row)
      )
    );

  let success=0;
  let failed=0;

  for(const row of rows){

    const key =
      getRowKey(row);

    if(!key){

      failed++;
      continue;
    }

    try{

      const {
        error
      } =
        await supabase.rpc(
          "cr_admin_delete",
          {
            p_table:
              state.currentTable,
            p_key:key
          }
        );

      if(error){
        throw error;
      }

      success++;

    }catch(error){

      console.error(error);

      failed++;
    }
  }

  state.selected.clear();

  toast(
    `Bulk delete complete: ${success} deleted, ${failed} failed.`,
    failed ? "error" : "success"
  );

  await loadSchema();

  await loadTable(
    state.currentTable,
    false
  );
}

/* =========================================================
   BULK PUBLISH / UNPUBLISH
========================================================= */

async function bulkPublish(publish){

  const rows =
    state.currentRows.filter(
      row=>state.selected.has(
        rowIdentity(row)
      )
    );

  if(!rows.length){

    toast(
      "Select records first.",
      "error"
    );

    return;
  }

  /*
    Supports common publishing columns.
  */

  const candidateColumns=[
    "is_published",
    "published",
    "published_at",
    "status"
  ];

  let success=0;
  let failed=0;

  for(const row of rows){

    const key =
      getRowKey(row);

    if(!key){
      failed++;
      continue;
    }

    let patch=null;

    if(
      Object.prototype.hasOwnProperty.call(
        row,
        "is_published"
      )
    ){

      patch={
        is_published:publish
      };

    }else if(
      Object.prototype.hasOwnProperty.call(
        row,
        "published"
      )
    ){

      patch={
        published:publish
      };

    }else if(
      Object.prototype.hasOwnProperty.call(
        row,
        "status"
      )
    ){

      patch={
        status:
          publish
            ? "published"
            : "draft"
      };

    }else if(
      Object.prototype.hasOwnProperty.call(
        row,
        "published_at"
      )
    ){

      patch={
        published_at:
          publish
            ? new Date().toISOString()
            : null
      };

    }

    if(!patch){

      failed++;
      continue;
    }

    try{

      const {
        error
      } =
        await supabase.rpc(
          "cr_admin_update",
          {
            p_table:
              state.currentTable,
            p_key:key,
            p_row:patch
          }
        );

      if(error){
        throw error;
      }

      success++;

    }catch(error){

      console.error(error);

      failed++;
    }
  }

  state.selected.clear();

  toast(
    `${publish?"Publish":"Unpublish"} complete: ${success} changed, ${failed} failed.`,
    failed ? "error" : "success"
  );

  await loadSchema();

  await loadTable(
    state.currentTable,
    false
  );
}

function csvEscape(value){

  if(value===null ||
     value===undefined){

    return "";
  }

  let text =
    typeof value==="object"
      ? JSON.stringify(value)
      : String(value);

  if(
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n")
  ){

    text =
      '"' +
      text.replaceAll('"','""') +
      '"';
  }

  return text;
}

function exportCurrentTableCSV(){

  const rows =
    state.currentRows;

  const columns =
    state.currentColumns;

  if(!columns.length){

    toast(
      "No rows to export.",
      "error"
    );

    return;
  }

  const csv=[
    columns.map(csvEscape).join(","),
    ...rows.map(
      row=>
        columns
          .map(
            col=>
              csvEscape(row[col])
          )
          .join(",")
    )
  ].join("\n");

  downloadBlob(
    csv,
    `crowrules-${state.currentTable}-${timestamp()}.csv`,
    "text/csv;charset=utf-8"
  );
}

/* =========================================================
   SCHEMA RELATIONSHIP MAP
========================================================= */

function renderSchema(){

  const tables =
    state.graph?.tables || [];

  const relations =
    state.graph?.relations || [];

  const nodePositions={};

  /*
    Simple deterministic layout.
  */

  tables.forEach((table,index)=>{

    const col =
      index % 6;

    const row =
      Math.floor(index / 6);

    nodePositions[
      table.name
    ]={
      x:30 + col*285,
      y:30 + row*260
    };
  });

  content.innerHTML=`

    <div class="panel">

      <div class="panel-header">

        <div>

          <div class="panel-title">
            🔗 Visual Supabase Schema Relationship Map
          </div>

          <div style="
            color:var(--muted);
            font-size:12px;
            margin-top:4px">

            ${tables.length}
            tables ·
            ${relations.length}
            foreign-key relationships

          </div>

        </div>

        <button
          class="btn"
          onclick="loadSchema().then(()=>renderSchema())">
          ↻ Refresh Map
        </button>

      </div>

      <div class="schema-map">

        <div class="schema-canvas">

          <svg
            class="schema-svg"
            viewBox="0 0 1800 1000">

            ${
              relations.map(rel=>{

                const from =
                  nodePositions[
                    rel.from_table
                  ];

/* =========================================================
   FULL DATABASE JSON EXPORT
========================================================= */

async function exportDatabaseJSON(){

  const output={
    exported_at:
      new Date().toISOString(),

    project:
      SUPABASE_URL,

    tables:{}
  };

  try{

    for(const table of state.tables){

      const count =
        Number(table.count || 0);

      /*
        Protect the browser from attempting an enormous
        single request. Export in pages.
      */

      const rows=[];

      const pageSize=500;

      for(
        let offset=0;
        offset<count;
        offset+=pageSize
      ){

        const {
          data,
          error
        } =
          await supabase.rpc(
            "cr_admin_table_data",
            {
              p_table:
                table.name,

              p_limit:
                pageSize,

              p_offset:
                offset,

              p_order_col:
                null,

              p_desc:
                false,

              p_search:
                null
            }
          );

        if(error){
          throw new Error(
            `${table.name}: ${error.message}`
          );
        }

        const page =
          Array.isArray(data)
            ? data
            : [];

        rows.push(...page);

        if(page.length<pageSize){
          break;
        }
      }

      output.tables[
        table.name
      ]={
        type:table.type,
        rows
      };
    }

    downloadBlob(
      JSON.stringify(
        output,
        null,
        2
      ),
      `crowrules-database-backup-${timestamp()}.json`,
      "application/json"
    );

    toast(
      "Database JSON export created.",
      "success"
    );

  }catch(error){

    toast(
      "Database export failed: " +
      error.message,
      "error"
    );
  }
}

async function exportDatabaseCSVBundle(){

  try{

    /*
      Browser-compatible bundle as one ZIP is intentionally
      avoided because this single-file application does not
      require another dependency.
      
      Instead create a JSON object containing CSV strings.
    */

    const bundle={};

    for(const table of state.tables){

      const {
        data,
        error
      } =
        await supabase.rpc(
          "cr_admin_table_data",
          {
            p_table:table.name,
            p_limit:500,
            p_offset:0,
            p_order_col:null,
            p_desc:false,
            p_search:null
          }
        );

      if(error){
        throw error;
      }

      const rows =
        Array.isArray(data)
          ? data
          : [];

      if(!rows.length){
        bundle[table.name]="";
        continue;
      }

      const columns =
        Object.keys(rows[0]);

      bundle[table.name]=[
        columns.map(csvEscape).join(","),
        ...rows.map(
          row=>
            columns.map(
              col=>
                csvEscape(row[col])
            ).join(",")
        )
      ].join("\n");
    }

    downloadBlob(
      JSON.stringify(
        bundle,
        null,
        2
      ),
      `crowrules-csv-bundle-${timestamp()}.json`,
      "application/json"
    );

    toast(
      "CSV bundle export created.",
      "success"
    );

  }catch(error){

    toast(
      "CSV bundle export failed: " +
      error.message,
      "error"
    );
  }
}

   IMPORT
========================================================= */

async function importSelectedFile(){

  const input =
    $("importFile");

  const table =
    $("importTable")
      ?.value;

  if(!input?.files?.length){

    toast(
      "Choose a JSON or CSV file first.",
      "error"
    );

    return;
  }

  if(!table){

    toast(
      "Select a target table.",
      "error"
    );

    return;
  }

  const file =
    input.files[0];

  const text =
    await file.text();

  try{

    let rows=[];

    if(
      file.name
        .toLowerCase()
        .endsWith(".json")
    ){

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){

        rows=parsed;

      }else if(
        Array.isArray(parsed.rows)
      ){

        rows=parsed.rows;

      }else if(
        parsed.tables &&
        parsed.tables[table] &&
        Array.isArray(
          parsed.tables[table].rows
        )
      ){

        rows=
          parsed.tables[
            table
          ].rows;

      }else{

        throw new Error(
          "JSON does not contain an array of records."
        );
      }

    }else{

      rows =
        parseCSV(text);
    }

    if(!rows.length){

      toast(
        "No records found in import file.",
        "error"
      );

      return;
    }

    if(
      !confirm(
        `Import ${rows.length} records into ${table}?`
      )
    ){
      return;
    }

    let success=0;
    let failed=0;

    for(const row of rows){

      try{

        const {
          error
        } =
          await supabase.rpc(
            "cr_admin_insert",
            {
              p_table:table,
              p_row:row
            }
          );

        if(error){
          throw error;
        }

        success++;

      }catch(error){

        console.error(
          "Import row failed:",
          error
        );

        failed++;
      }
    }

    toast(
      `Import complete: ${success} inserted, ${failed} failed.`,
      failed ? "error" : "success"
    );

    await loadSchema();

    if(state.currentTable===table){

      await loadTable(
        table,
        false
      );
    }

  }catch(error){

    toast(
      "Import failed: " +
      error.message,
      "error"
    );
  }
}

/* =========================================================
   SIMPLE CSV PARSER
========================================================= */

function parseCSV(text){

  const lines=[];
  let row=[];
  let cell="";
  let quoted=false;

  for(let i=0;i<text.length;i++){

    const ch=text[i];
    const next=text[i+1];

    if(ch==='"'){

      if(quoted && next==='"'){

        cell+='"';
        i++;

      }else{

        quoted=!quoted;
      }

    }else if(
      ch==="," &&
      !quoted
    ){

      row.push(cell);
      cell="";

    }else if(
      (ch==="\n" || ch==="\r") &&
      !quoted
    ){

      if(
        ch==="\r" &&
        next==="\n"
      ){
        i++;
      }

      row.push(cell);
      cell="";

      if(
        row.some(
          x=>x!==""
        )
      ){
        lines.push(row);
      }

      row=[];

    }else{

      cell+=ch;
    }
  }

  row.push(cell);

  if(
    row.some(
      x=>x!==""
    )
  ){

    lines.push(row);
  }

  if(lines.length<2){
    return [];
  }

  const headers =
    lines[0];

  return lines
    .slice(1)
    .map(values=>{

      const obj={};

      headers.forEach(
        (header,index)=>{

          let value =
            values[index] ?? "";

          if(value===""){
            obj[header]=null;
            return;
          }

          if(
            value==="true" ||
            value==="false"
          ){

            obj[header]=
              value==="true";

            return;
          }

          const trimmed =
            value.trim();

          if(
            (
              trimmed.startsWith("{") &&
              trimmed.endsWith("}")
            ) ||
            (
              trimmed.startsWith("[") &&
              trimmed.endsWith("]")
            )
          ){

            try{

              obj[header]=
                JSON.parse(trimmed);

              return;

            }catch{}
          }

          obj[header]=value;
        }
      );

      return obj;
    });
}

            state.view
          );
        }

        toast(
          "Admin data refreshed.",
          "success"
        );

      }catch(error){

        toast(
          error.message,
          "error"
        );
      }
    }
  );

/* =========================================================
   LOGOUT EVENT
========================================================= */

$("logoutBtn")
  .addEventListener(
    "click",
    logout
  );

/* =========================================================
   LOGIN EVENTS
========================================================= */

$("loginForm")
  .addEventListener(
    "submit",
    async e=>{

      e.preventDefault();

      await login(
        $("loginEmail").value,
        $("loginPassword").value
      );
    }
  );

$("resetPasswordBtn")
  .addEventListener(
    "click",
    resetPassword
  );

/* =========================================================
   AUTH STATE LISTENER
========================================================= */

function setupAuthListener(){

  supabase.auth.onAuthStateChange(
    async (event,session)=>{

      console.log(
        "Supabase Auth Event:",
        event
      );

      if(
        event==="SIGNED_OUT"
      ){

        app.classList.add("hidden");
        loginScreen.classList.remove("hidden");

        return;
      }

      if(
        event==="SIGNED_IN" ||
        event==="TOKEN_REFRESHED"
      ){

        /*
          Avoid doing heavy work directly inside
          the auth callback.
        */

        setTimeout(
          async ()=>{

            try{

              await authorizeCurrentUser();

              if(
                app.classList.contains(
                  "hidden"
                )
              ){

                await enterAdmin();

              }

            }catch(error){

              console.error(
                "Auth revalidation:",
                error
              );

              app.classList.add(
                "hidden"
              );

              loginScreen.classList.remove(
                "hidden"
              );

              setLoginStatus(
                error.message,
                true
              );
            }

          },
          0
        );
      }

    }
  );
}

/* =========================================================
   INITIAL BOOT
========================================================= */

async function boot(){

  try{

    setBootStatus(
      "Connecting to Supabase…"
    );

    await initializeSupabase();

    setupAuthListener();

    setBootStatus(
      "Checking existing authentication session…"
    );

    const {
      data
    } =
      await supabase.auth.getSession();

    if(!data?.session){

      bootScreen.classList.add(
        "hidden"
      );

      loginScreen.classList.remove(
        "hidden"
      );

      return;
    }

    setBootStatus(
      "Verifying authenticated user…"
    );

    await authorizeCurrentUser();

    setBootStatus(
      "Checking CrowRules Admin authorization…"
    );

    await enterAdmin();

  }catch(error){

    console.error(
      "Admin boot error:",
      error
    );

    bootScreen.classList.add(
      "hidden"
    );

    loginScreen.classList.remove(
      "hidden"
    );

    setLoginStatus(
      error.message,
      true
    );
  }
}

/* =========================================================
   START
========================================================= */

boot();

</script>
