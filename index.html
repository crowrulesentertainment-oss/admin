<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<meta name="description" content="CrowRules Entertainment Universal Supabase Admin Dashboard">
<title>CrowRules Entertainment — Universal Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#05060a;
  --bg2:#090b12;
  --panel:#0d1018;
  --panel2:#111522;
  --panel3:#151a28;
  --line:rgba(255,255,255,.09);
  --text:#f4f7ff;
  --muted:#8e98ad;
  --cyan:#00e5ff;
  --purple:#9b5cff;
  --pink:#ff2bd6;
  --green:#35e59a;
  --yellow:#ffd166;
  --red:#ff4d6d;
  --shadow:0 18px 60px rgba(0,0,0,.45);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 15% 10%,rgba(155,92,255,.12),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(0,229,255,.08),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Montserrat,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
  display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:290px;
  min-height:100vh;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:50;
  padding:20px;
  border-right:1px solid var(--line);
  background:
    linear-gradient(180deg,rgba(14,17,27,.98),rgba(5,6,10,.98));
  backdrop-filter:blur(20px);
  overflow-y:auto;
}

.brand{
  padding:8px 10px 22px;
}

.brand-title{
  font-family:Orbitron,sans-serif;
  font-weight:900;
  font-size:21px;
  letter-spacing:1px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.brand-sub{
  margin-top:5px;
  font-size:10px;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}

.nav-section{
  margin:18px 0 8px;
  padding:0 10px;
  color:#657087;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#aab3c6;
  border-radius:12px;
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  transition:.18s ease;
}

.nav button:hover{
  background:rgba(255,255,255,.045);
  color:#fff;
}

.nav button.active{
  color:#fff;
  border-color:rgba(0,229,255,.18);
  background:
    linear-gradient(90deg,rgba(0,229,255,.09),rgba(155,92,255,.08));
  box-shadow:inset 3px 0 0 var(--cyan);
}

.nav-icon{
  width:24px;
  text-align:center;
}

.table-nav{
  max-height:calc(100vh - 420px);
  overflow-y:auto;
  padding-right:3px;
}

.table-nav button{
  font-size:12px;
  padding:9px 10px;
}

.table-nav button .table-count{
  margin-left:auto;
  font-size:10px;
  color:#69748a;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  width:calc(100% - 290px);
  margin-left:290px;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  border-bottom:1px solid var(--line);
  background:rgba(5,6,10,.82);
  backdrop-filter:blur(20px);
}

.page-title{
  font-family:Orbitron,sans-serif;
  font-size:17px;
  font-weight:800;
}

.page-subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.role-pill{
  border:1px solid rgba(155,92,255,.35);
  background:rgba(155,92,255,.09);
  color:#d9c5ff;
  padding:7px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.content{
  padding:28px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  border:1px solid var(--line);
  color:#fff;
  background:#121724;
  border-radius:10px;
  padding:9px 13px;
  font-weight:700;
  font-size:12px;
  transition:.18s ease;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:rgba(255,255,255,.18);
}

.btn-primary{
  border-color:rgba(0,229,255,.35);
  background:linear-gradient(135deg,rgba(0,229,255,.17),rgba(155,92,255,.14));
}

.btn-success{
  border-color:rgba(53,229,154,.3);
  background:rgba(53,229,154,.08);
}

.btn-danger{
  border-color:rgba(255,77,109,.3);
  background:rgba(255,77,109,.08);
}

.btn-small{
  padding:7px 9px;
  font-size:11px;
}

/* =========================================================
   DASHBOARD
========================================================= */

.hero{
  padding:28px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:
    radial-gradient(circle at 85% 10%,rgba(0,229,255,.11),transparent 30%),
    radial-gradient(circle at 15% 100%,rgba(155,92,255,.11),transparent 35%),
    linear-gradient(135deg,#0d111b,#0a0d14);
  box-shadow:var(--shadow);
  margin-bottom:22px;
}

.hero h1{
  margin:0;
  font-family:Orbitron,sans-serif;
  font-size:28px;
}

.hero p{
  max-width:800px;
  color:var(--muted);
  line-height:1.7;
  margin:10px 0 0;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:22px;
}

.stat{
  padding:20px;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(145deg,#0d111a,#090c13);
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  font-weight:800;
}

.stat-value{
  margin-top:9px;
  font-family:Orbitron,sans-serif;
  font-size:27px;
  font-weight:800;
}

.stat-detail{
  margin-top:5px;
  color:#667187;
  font-size:10px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1.4fr .9fr;
  gap:18px;
}

.panel{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:linear-gradient(145deg,#0d1119,#090c12);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.panel-head{
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 18px;
  border-bottom:1px solid var(--line);
}

.panel-title{
  font-family:Orbitron,sans-serif;
  font-size:13px;
  font-weight:800;
}

.panel-body{
  padding:18px;
}

.system-list{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.system-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.system-row:last-child{
  border-bottom:0;
}

.status-dot{
  width:8px;
  height:8px;
  display:inline-block;
  border-radius:50%;
  margin-right:7px;
  background:var(--green);
  box-shadow:0 0 12px rgba(53,229,154,.7);
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick{
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0d1119;
}

.quick b{
  display:block;
  font-family:Orbitron,sans-serif;
  font-size:14px;
}

.quick span{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
}

/* =========================================================
   TABLE MANAGER
========================================================= */

.table-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px;
}

.table-name{
  font-family:Orbitron,sans-serif;
  font-size:22px;
  font-weight:900;
}

.table-meta{
  color:var(--muted);
  margin-top:5px;
  font-size:11px;
}

.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.search{
  min-width:230px;
  flex:1;
  max-width:480px;
}

.input,
.textarea,
.select{
  width:100%;
  color:#fff;
  background:#090c13;
  border:1px solid rgba(255,255,255,.1);
  border-radius:9px;
  padding:10px 11px;
  outline:none;
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:rgba(0,229,255,.45);
  box-shadow:0 0 0 3px rgba(0,229,255,.06);
}

.textarea{
  min-height:130px;
  resize:vertical;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px;
}

.data-table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
}

.data-table th{
  position:sticky;
  top:0;
  z-index:2;
  background:#10141e;
  color:#8d98ae;
  text-align:left;
  padding:11px;
  font-size:9px;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
}

.data-table td{
  padding:11px;
  border-top:1px solid rgba(255,255,255,.055);
  color:#d8deea;
  font-size:11px;
  vertical-align:top;
  max-width:320px;
}

.data-table tr:hover td{
  background:rgba(255,255,255,.018);
}

.cell{
  max-width:280px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.cell.boolean{
  font-weight:800;
}

.true{
  color:var(--green);
}

.false{
  color:#667187;
}

.actions{
  display:flex;
  gap:5px;
  white-space:nowrap;
}

.pagination{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:13px;
  color:var(--muted);
  font-size:10px;
}

.page-buttons{
  display:flex;
  gap:5px;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(920px,100%);
  max-height:90vh;
  overflow:auto;
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  background:#0b0f17;
  box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px 20px;
  background:#0b0f17;
  border-bottom:1px solid var(--line);
}

.modal-title{
  font-family:Orbitron,sans-serif;
  font-size:15px;
  font-weight:900;
}

.modal-body{
  padding:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.form-field{
  min-width:0;
}

.form-field.full{
  grid-column:1/-1;
}

.form-label{
  display:block;
  margin-bottom:6px;
  color:#8d98ae;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.form-help{
  margin-top:5px;
  color:#596478;
  font-size:9px;
}

.modal-foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:15px 20px;
  border-top:1px solid var(--line);
}

/* =========================================================
   ROLE PANEL
========================================================= */

.role-manager{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.member-card{
  border:1px solid var(--line);
  background:#0d1119;
  border-radius:15px;
  padding:15px;
}

.member-main{
  display:flex;
  gap:12px;
  align-items:center;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#171c28;
  border:1px solid var(--line);
}

.member-name{
  font-weight:800;
  font-size:13px;
}

.member-user{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.member-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:13px;
}

.member-stat{
  padding:9px;
  border-radius:9px;
  background:#090c13;
  text-align:center;
}

.member-stat b{
  display:block;
  font-family:Orbitron,sans-serif;
  font-size:11px;
}

.member-stat span{
  color:#677187;
  font-size:8px;
}

.role-editor{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.role-editor .select{
  flex:1;
}

/* =========================================================
   AUDIT
========================================================= */

.audit-list{
  display:flex;
  flex-direction:column;
}

.audit-row{
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.audit-row:last-child{
  border-bottom:0;
}

.audit-action{
  font-weight:800;
  color:#fff;
}

.audit-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.audit-json{
  margin-top:7px;
  padding:8px;
  background:#070a10;
  border-radius:8px;
  color:#8e9ab0;
  font-family:monospace;
  font-size:9px;
  white-space:pre-wrap;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:34px;
  margin-bottom:10px;
}

.loader{
  display:inline-block;
  width:18px;
  height:18px;
  border:2px solid rgba(255,255,255,.12);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================================================
   TOAST
========================================================= */

.toast-container{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  display:flex;
  flex-direction:column;
  gap:8px;
  width:min(380px,calc(100vw - 36px));
}

.toast{
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  background:#10141d;
  box-shadow:var(--shadow);
  font-size:11px;
}

.toast.success{
  border-color:rgba(53,229,154,.3);
}

.toast.error{
  border-color:rgba(255,77,109,.35);
}

.toast.info{
  border-color:rgba(0,229,255,.3);
}

/* =========================================================
   LOGIN
========================================================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 25%,rgba(155,92,255,.16),transparent 30%),
    var(--bg);
}

.login-card{
  width:min(480px,100%);
  border:1px solid var(--line);
  border-radius:22px;
  padding:32px;
  background:rgba(10,13,20,.94);
  box-shadow:0 30px 100px rgba(0,0,0,.65);
  text-align:center;
}

.login-logo{
  font-family:Orbitron,sans-serif;
  font-size:25px;
  font-weight:900;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.login-card h1{
  margin:22px 0 8px;
  font-family:Orbitron,sans-serif;
  font-size:19px;
}

.login-card p{
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.login-error{
  margin-top:15px;
  color:#ff9cad;
  font-size:11px;
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-menu{
  display:none;
}

@media(max-width:1100px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:850px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
    margin-left:0;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:15px;
  }

  .role-manager{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-field.full{
    grid-column:auto;
  }
}

@media(max-width:560px){
  .stats{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:21px;
  }

  .table-header{
    flex-direction:column;
  }

  .search{
    min-width:0;
  }

  .top-actions .role-pill{
    display:none;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     LOGIN
======================================================== -->
<div id="loginScreen" class="login-screen hidden">
  <div class="login-card">

    <div class="login-logo">
      CROWRULES
    </div>

    <h1>Universal Admin</h1>

    <p>
      Your Supabase session is required to access the CrowRules
      Entertainment administration system.
    </p>

    <button id="loginButton" class="btn btn-primary" style="width:100%;margin-top:12px">
      Sign In
    </button>

    <div id="loginError" class="login-error"></div>

  </div>
</div>

<!-- =======================================================
     APPLICATION
======================================================== -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">

    <div class="brand">
      <div class="brand-title">CROWRULES</div>
      <div class="brand-sub">Universal Admin Engine</div>
    </div>

    <div class="nav-section">Command Center</div>

    <nav class="nav">
      <button data-view="dashboard" class="active">
        <span class="nav-icon">◈</span>
        Dashboard
      </button>

      <button data-view="members">
        <span class="nav-icon">♟</span>
        Members
      </button>

      <button data-view="leaderboard">
        <span class="nav-icon">★</span>
        Leaderboard
      </button>

      <button data-view="audit">
        <span class="nav-icon">⌁</span>
        Audit Log
      </button>
    </nav>

    <div class="nav-section">Database</div>

    <div id="tableNav" class="nav table-nav"></div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:12px">

        <button id="mobileMenu" class="btn mobile-menu">
          ☰
        </button>

        <div>
          <div id="pageTitle" class="page-title">
            Command Center
          </div>

          <div id="pageSubtitle" class="page-subtitle">
            CrowRules Entertainment
          </div>
        </div>

      </div>

      <div class="top-actions">

        <span id="rolePill" class="role-pill">
          Checking…
        </span>

        <button id="refreshButton" class="btn">
          ↻ Refresh
        </button>

        <button id="signOutButton" class="btn btn-danger">
          Sign Out
        </button>

      </div>

    </header>

    <section id="content" class="content"></section>

  </main>

</div>

<!-- =======================================================
     MODAL
======================================================== -->
<div id="modalBackdrop" class="modal-backdrop hidden">

  <div class="modal">

    <div class="modal-head">

      <div id="modalTitle" class="modal-title">
        Edit Record
      </div>

      <button id="modalClose" class="btn">
        ✕
      </button>

    </div>

    <div id="modalBody" class="modal-body"></div>

    <div class="modal-foot">

      <button id="modalCancel" class="btn">
        Cancel
      </button>

      <button id="modalSave" class="btn btn-primary">
        Save Changes
      </button>

    </div>

  </div>

    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

function formatDate(value){
  if(!value){

  return d.toLocaleString();

function normalizeSchemaResponse(data){

  let raw = data;

  if(typeof raw === 'string'){
    try{
      raw = JSON.parse(raw);
    }catch{}
  }

  let tables = [];

  if(Array.isArray(raw)){
    tables = raw;
  }else if(Array.isArray(raw?.tables)){
    tables = raw.tables;
  }else if(Array.isArray(raw?.data)){
    tables = raw.data;
  }else if(raw && typeof raw === 'object'){

    for(const [name,value] of Object.entries(raw)){

      if(
        Array.isArray(value) ||
        typeof value === 'object'
      ){
        tables.push({
          name,
          ...(value || {})
        });
      }
    }
  }

  return tables
    .map(t => {

      const name =
        String(
          t.name ||
          t.table_name ||
          t.table ||
          ''
        ).replace(/^public\./,'');

      let columns =
        t.columns ||
        t.column_details ||
        [];

      if(!Array.isArray(columns)){
        columns = [];
      }

      columns = columns.map(c => ({
        name:c.name || c.column_name,
        data_type:
          c.data_type ||
          c.type ||
          c.format ||
          'text',
        nullable:
          c.nullable ??
          c.is_nullable ??
          (
            Array.isArray(c.options)
              ? c.options.includes('nullable')
              : false
          ),
        default_value:
          c.default_value ??
          c.column_default ??
          null,
        identity:
          c.identity ||
          c.is_identity ||
          false
      }));

      return {
        ...t,
        name,
        columns,
        primary_keys:
          t.primary_keys ||
          t.primary_key ||
          ['id']
      };
    })
    .filter(t => t.name);
}

async function openTable(name){

  name =
    String(name).replace(/^public\./,'');

  state.currentTable = name;
  state.currentView = 'table';
  state.page = 0;
  state.search = '';
  state.order = 'created_at';
  state.direction = 'desc';

  document.querySelectorAll('[data-view]')
    .forEach(b => b.classList.remove('active'));

  $('sidebar').classList.remove('open');

  await loadTable();
}

async function loadTable(){

  const name = state.currentTable;

  if(!name){
    return;
  }

  const meta =
    state.tableMap.get(name) ||
    {
      name,
      columns:[],
      primary_keys:['id']
    };

  $('pageTitle').textContent =
    prettyName(name);

  $('pageSubtitle').textContent =
    `public.${name}`;

  content.innerHTML = `
    <div class="empty">
      <span class="loader"></span>
      <div style="margin-top:10px">Loading ${escapeHtml(name)}…</div>
    </div>
  `;

  try{

    const {
      data,
      error
    } = await db.rpc(
      'cr_admin_v54_rows',
      {
        p_schema:'public',
        p_table:name,
        p_limit:state.pageSize,
        p_offset:state.page * state.pageSize,
        p_order:
          state.order || 'created_at',
        p_direction:
          state.direction || 'desc'
      }
    );

    if(error){
      throw error;
    }

    const normalized =
      normalizeRowsResponse(data);

    state.rows =
      normalized.rows;

    state.totalRows =
      normalized.total;

    renderTable(meta);

  }catch(error){

    console.error(error);

    /*
      If v54 rows cannot be used, fall back to
      cr_admin_crud for ordinary id-based tables.
    */

    try{

      const {
        data,
        error:fallbackError
      } = await db.rpc(
        'cr_admin_crud',
        {
          p_action:'list',
          p_table:name,
          p_id:null,
          p_data:null
        }
      );

      if(fallbackError){
        throw fallbackError;
      }

      const rows =
        Array.isArray(data)
          ? data
          : (
            Array.isArray(data?.rows)
              ? data.rows
              : []
          );

      state.rows =
        rows.slice(
          state.page * state.pageSize,
          (state.page+1)*state.pageSize
        );

      state.totalRows =
        rows.length;

      renderTable(meta);

      toast(
        'Using compatibility CRUD mode for this table.',
        'info'
      );

    }catch(fallbackError){

      console.error(fallbackError);

      content.innerHTML = `
        <div class="panel">
          <div class="empty">
            <div class="empty-icon">⚠</div>
            <h3>Unable to load table</h3>
            <p>
              ${escapeHtml(errorMessage(error))}
            </p>
          </div>
        </div>
      `;
    }
  }
}

function normalizeRowsResponse(data){

  let raw = data;

  if(typeof raw === 'string'){
    try{
      raw = JSON.parse(raw);
    }catch{}
  }

  if(Array.isArray(raw)){
    return {
      rows:raw,
      total:raw.length
    };
  }

  return {
    rows:
      raw?.rows ||
      raw?.data ||
      raw?.records ||
      [],
    total:
      Number(
        raw?.total ??
        raw?.count ??
        raw?.total_count ??
        raw?.rows?.length ??
        0
      )
  };
}

        <button
          id="nextPage"
          class="btn btn-small"
          ${
            (state.page+1)*state.pageSize >= state.totalRows
              ? 'disabled'
              : ''
          }
        >
          Next →
        </button>

      </div>

    </div>
  `;

  $('tableSearch').addEventListener(
    'keydown',
    event => {
      if(event.key === 'Enter'){
        performSearch();
      }
    }
  );

  $('searchButton').onclick =
    performSearch;

  $('clearSearch').onclick = async()=>{

    state.search = '';

    await loadTable();
  };

  $('refreshTable').onclick =
    loadTable;

  $('prevPage').onclick = async()=>{

    if(state.page > 0){

      state.page--;

      await loadTable();
    }
  };

  $('nextPage').onclick = async()=>{

    if(
      (state.page+1)*state.pageSize <
      state.totalRows
    ){

      state.page++;

      await loadTable();
    }
  };

  if(writable && $('addRecord')){

    $('addRecord').onclick = () => {

      state.editingRow = null;
      state.editingMode = 'insert';

      openEditor(
        name,
        meta,
        null,
        'insert'
      );
    };
  }

  document.querySelectorAll('[data-edit-id]')
    .forEach(button => {

      button.onclick = () => {

        const index =
          Number(button.dataset.editId);

        state.editingRow =
          state.rows[index];

        state.editingMode =
          'update';

        openEditor(
          name,
          meta,
          state.rows[index],
          'update'
        );
      };
    });

  document.querySelectorAll('[data-delete-id]')
    .forEach(button => {

      button.onclick = async()=>{

        const index =
          Number(button.dataset.deleteId);

        await deleteRecord(
          name,
          meta,
          state.rows[index]
        );
      };
    });
}

function inferColumns(rows){

  if(!rows.length){
    return [];
  }

  return Object.keys(rows[0]).map(name => ({
    name,
    data_type:'text',
    nullable:true
  }));
}

function renderDataTable(columns,writable){

  /*
    Display the most useful columns first.
    We don't remove data from the underlying record.
  */

  const visible =
    columns.length
      ? columns.slice(0,10)
      : Object.keys(state.rows[0]).map(name=>({
          name,
          data_type:'text'
        }));

  return `
    <table class="data-table">

      <thead>
        <tr>

          ${visible.map(c => `
            <th>${escapeHtml(c.name)}</th>
          `).join('')}

          <th>Actions</th>

        </tr>
      </thead>

      <tbody>

        ${state.rows.map((row,index) => `

          <tr>

            ${visible.map(c => {

              const value =
                row[c.name];

              return `
                <td>
                  ${renderCell(value,c)}
                </td>
              `;

            }).join('')}

            <td>

              <div class="actions">

                ${
                  writable
                    ? `
                      <button
                        class="btn btn-small"
                        data-edit-id="${index}"
                      >
                        Edit
                      </button>

                      <button
                        class="btn btn-danger btn-small"
                        data-delete-id="${index}"
                      >
                        Delete
                      </button>
                    `
                    : `
                      <span style="color:#667187">
                        View
                      </span>
                    `
                }

              </div>

            </td>

          </tr>

        `).join('')}

      </tbody>

    </table>
  `;
}

function renderCell(value,column){

  if(value === null || value === undefined){
    return `<span style="color:#596478">NULL</span>`;
  }

  const type =
    String(column?.data_type || '').toLowerCase();

  if(typeof value === 'boolean'){
    return `
      <span class="cell boolean ${value?'true':'false'}">
        ${value ? 'TRUE' : 'FALSE'}
      </span>
    `;
  }

  if(
    type.includes('timestamp') ||
    type === 'date'
  ){
    return `
      <div class="cell" title="${escapeHtml(value)}">
        ${escapeHtml(formatDate(value))}
      </div>
    `;
  }

  if(
    type.includes('json')
  ){

    const json =
      typeof value === 'string'
        ? value
        : JSON.stringify(value);

    return `
      <div
        class="cell"
        title="${escapeHtml(json)}"
      >
        ${escapeHtml(json)}
      </div>
    `;
  }

  if(
    typeof value === 'object'
  ){

    return `
      <div
        class="cell"
        title="${escapeHtml(JSON.stringify(value))}"
      >
        ${escapeHtml(JSON.stringify(value))}
      </div>
    `;
  }

  return `
    <div
      class="cell"
      title="${escapeHtml(value)}"
    >
      ${escapeHtml(value)}
    </div>
  `;
}

/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

  state.search =
    $('tableSearch').value.trim();

  state.page = 0;

  /*
    v54 rows currently receives pagination/order.
    Search support varies by installed version.
    For reliable browser-side searching, if a search
    term exists we retrieve a larger page and filter.
  */

  if(!state.search){

    await loadTable();

    return;
  }

  const name =
    state.currentTable;

  try{

    const {
      data,
      error
    } = await db.rpc(
      'cr_admin_v54_rows',
      {
        p_schema:'public',
        p_table:name,
        p_limit:500,
        p_offset:0,
        p_order:
          state.order || 'created_at',
        p_direction:
          state.direction || 'desc'
      }
    );

    if(error){
      throw error;
    }

    const normalized =
      normalizeRowsResponse(data);

    const term =
      state.search.toLowerCase();

    const filtered =
      normalized.rows.filter(row =>
        Object.values(row).some(value =>
          String(value ?? '')
            .toLowerCase()
            .includes(term)
        )
      );

    state.rows =
      filtered.slice(
        0,
        state.pageSize
      );

    state.totalRows =
      filtered.length;

    const meta =
      state.tableMap.get(name) ||
      {
        name,
        columns:inferColumns(filtered),
        primary_keys:['id']
      };

    renderTable(meta);

  }catch(error){

    toast(
      errorMessage(error),
      'error'
    );
  }
}

   EDITOR

function openEditor(
  table,
  meta,
  row,
  mode
){

  $('modalTitle').textContent =
    `${mode === 'insert' ? 'Add' : 'Edit'} ${prettyName(table)}`;

  const columns =
    meta.columns?.length
      ? meta.columns
      : inferColumns(row ? [row] : []);

  const primaryKeys =
    meta.primary_keys?.length
      ? meta.primary_keys
      : ['id'];

  $('modalBody').innerHTML = `
    <div style="margin-bottom:15px;color:#788398;font-size:10px">
      Table: public.${escapeHtml(table)}
      <br>
      Primary key:
      ${escapeHtml(primaryKeys.join(', '))}
    </div>

    <div class="form-grid">

      ${columns.map(column => {

        const name =
          column.name;

        if(!name){
          return '';
        }

        const type =
          String(
            column.data_type ||
            column.format ||
            'text'
          ).toLowerCase();

        const generated =
          Boolean(
            column.identity ||
            String(column.default_value || '')
              .toLowerCase()
              .includes('gen_random_uuid')
          );

        /*
          Existing generated ID fields should not be
          manually required on inserts.
        */

        const value =
          row?.[name] ??
          '';

        const disabled =
          mode === 'update' &&
          primaryKeys.includes(name)
            ? true
            : false;

        const fieldClass =
          type.includes('text') &&
          (
            name.includes('description') ||
            name.includes('message') ||
            name.includes('body') ||
            name.includes('bio') ||
            name.includes('content') ||
            name.includes('metadata')
          )
            ? 'full'
            : '';

        return `
          <div class="form-field ${fieldClass}">

            <label class="form-label">
              ${escapeHtml(name)}
            </label>

            ${buildField(
              column,
              value,
              disabled,
              generated,
              mode
            )}

            ${
              column.default_value
                ? `
                  <div class="form-help">
                    Default:
                    ${escapeHtml(
                      column.default_value
                    )}
                  </div>
                `
                : ''
            }

          </div>
        `;

      }).join('')}

    </div>
  `;
  
  $('modalBackdrop').classList.remove('hidden');
}

function buildField(
  column,
  value,
  disabled,
  generated,
  mode
){

  const name =
    column.name;

  const type =
    String(
      column.data_type ||
      column.format ||
      'text'
    ).toLowerCase();

  const id =
    'field_' +
    name.replace(/[^a-zA-Z0-9_-]/g,'_');

  const safeValue =
    value === null ||
    value === undefined
      ? ''
      : value;

  if(
    type === 'bool' ||
    type.includes('boolean')
  ){

    return `
      <select
        id="${id}"
        class="select"
        ${disabled ? 'disabled' : ''}
      >
        <option
          value=""
          ${safeValue === '' ? 'selected' : ''}
        >
          NULL
        </option>

        <option
          value="true"
          ${safeValue === true ? 'selected' : ''}
        >
          TRUE
        </option>

        <option
          value="false"
          ${safeValue === false ? 'selected' : ''}
        >
          FALSE
        </option>

      </select>
    `;
  }

  if(
    type.includes('json')
  ){

    let jsonValue = '';

    if(
      typeof safeValue === 'object'
    ){

      jsonValue =
        JSON.stringify(
          safeValue,
          null,
          2
        );

    }else{

      jsonValue =
        String(safeValue);
    }

    return `
      <textarea
        id="${id}"
        class="textarea"
        data-json="true"
        ${disabled ? 'disabled' : ''}
      >${escapeHtml(jsonValue)}</textarea>
    `;
  }

  if(
    type.includes('timestamp') ||
    type.includes('date')
  ){

    let dateValue =
      String(safeValue);

    if(
      type.includes('timestamp') &&
      dateValue
    ){

      const d =
        new Date(dateValue);

      if(!Number.isNaN(d.getTime())){
        dateValue =
          d.toISOString().slice(
            0,
            16
          );
      }
    }

    return `
      <input
        id="${id}"
        class="input"
        type="${
          type === 'date'
            ? 'date'
            : 'datetime-local'
        }"
        value="${escapeHtml(dateValue)}"
        ${disabled ? 'disabled' : ''}
      >
    `;
  }

  if(
    type.includes('int') ||
    type.includes('numeric') ||
    type.includes('decimal') ||
    type.includes('double') ||
    type.includes('real')
  ){

    return `
      <input
        id="${id}"
        class="input"
        type="number"
        value="${escapeHtml(safeValue)}"
        ${disabled ? 'disabled' : ''}
      >
    `;
  }

  if(
    type.includes('text') ||
    type.includes('char')
  ){

    const longField =
      String(name).length > 30 ||
      /description|message|body|bio|content|notes|metadata/i
        .test(name);

    if(longField){

      return `
        <textarea
          id="${id}"
          class="textarea"
          ${disabled ? 'disabled' : ''}
        >${escapeHtml(safeValue)}</textarea>
      `;
    }

    return `
      <input
        id="${id}"
        class="input"
        type="text"
        value="${escapeHtml(safeValue)}"
        ${disabled ? 'disabled' : ''}
      >
    `;
  }

  if(
    type === 'uuid'
  ){

    return `
      <input
        id="${id}"
        class="input"
        type="text"
        value="${escapeHtml(safeValue)}"
        placeholder="UUID"
        ${disabled ? 'disabled' : ''}
      >
    `;
  }

  if(
    type.includes('array')
  ){

    return `
      <textarea
        id="${id}"
        class="textarea"
        placeholder='["value1","value2"]'
        data-json="true"
        ${disabled ? 'disabled' : ''}
      >${escapeHtml(
        Array.isArray(safeValue)
          ? JSON.stringify(
              safeValue,
              null,
              2
            )
          : String(safeValue)
      )}</textarea>
    `;
  }

  return `
    <input
      id="${id}"
      class="input"
      type="text"
      value="${escapeHtml(safeValue)}"
      ${disabled ? 'disabled' : ''}
    >
  `;
}

/* =========================================================
   SAVE
========================================================= */

$('modalSave').addEventListener(
  'click',
  saveRecord
);

async function saveRecord(){

  const table =
    state.currentTable;

  const meta =
    state.tableMap.get(table) ||
    {
      name:table,
      columns:[],
      primary_keys:['id']
    };

  if(!canWriteTable(table)){

    toast(
      'You do not have permission to modify this table.',
      'error'
    );

    return;
  }

  const columns =
    meta.columns?.length
      ? meta.columns
      : inferColumns(
          state.editingRow
            ? [state.editingRow]
            : []
        );

  const row = {};

  for(const column of columns){

    const name =
      column.name;

    if(!name){
      continue;
    }

    const input =
      document.getElementById(
        'field_' +
        name.replace(
          /[^a-zA-Z0-9_-]/g,
          '_'
        )
      );

    if(!input){
      continue;
    }

    if(input.disabled){
      continue;
    }

    let value =
      input.value;

    const type =
      String(
        column.data_type ||
        column.format ||
        ''
      ).toLowerCase();

    if(value === ''){
      value =
        column.nullable
          ? null
          : '';
    }

    if(
      type === 'bool' ||
      type.includes('boolean')
    ){

      if(value === ''){
        value = null;
      }else{
        value =
          value === 'true';
      }
    }

    if(
      type.includes('int') ||
      type.includes('numeric') ||
      type.includes('decimal') ||
      type.includes('double') ||
      type.includes('real')
    ){

      if(value !== null && value !== ''){
        value =
          Number(value);
      }
    }

    if(
      type.includes('json') ||
      input.dataset.json === 'true'
    ){

      if(
        value === '' ||
        value === null
      ){

        value = null;

      }else{

        try{

          value =
            JSON.parse(value);

        }catch(error){

          toast(
            `${name} contains invalid JSON.`,
            'error'
          );

          input.focus();

          return;
        }
      }
    }

    if(
      type === 'date'
    ){

      if(value === ''){
        value = null;
      }
    }

    if(
      type.includes('timestamp') &&
      value
    ){

      /*
        datetime-local -> ISO timestamp.
      */

      const d =
        new Date(value);

      if(!Number.isNaN(d.getTime())){
        value =
          d.toISOString();
      }
    }

    row[name] =
      value;
  }

  try{

    $('modalSave').disabled = true;

    $('modalSave').innerHTML =
      '<span class="loader"></span>';

    let primaryKey = null;

    if(
      state.editingMode === 'update'
    ){

      primaryKey = {};

      const primaryKeys =
        meta.primary_keys?.length
          ? meta.primary_keys
          : ['id'];

      for(const key of primaryKeys){

        primaryKey[key] =
          state.editingRow?.[key];

      }
    }

    const {
      data,
      error
    } = await db.rpc(
      'cr_admin_v54_write',
      {
        p_schema:'public',
        p_table:table,
        p_data:row,
        p_pk:primaryKey,
        p_mode:
          state.editingMode === 'insert'
            ? 'insert'
            : 'update'
      }
    );

    if(error){
      throw error;
    }

    closeModal();

    toast(
      state.editingMode === 'insert'
        ? 'Record created successfully.'
        : 'Record updated successfully.',
      'success'
    );

    await loadTable();

  }catch(error){

    console.error(error);

    toast(
      'Save failed: ' +
      errorMessage(error),
      'error'
    );

  }finally{

    $('modalSave').disabled = false;

    $('modalSave').textContent =
      'Save Changes';
  }
}

/* =========================================================
   DELETE
========================================================= */

async function deleteRecord(
  table,
  meta,
  row
){

  if(!canWriteTable(table)){

    toast(
      'You do not have permission to delete from this table.',
      'error'
    );

    return;
  }

  const primaryKeys =
    meta.primary_keys?.length
      ? meta.primary_keys
      : ['id'];

  const primaryKey = {};

  for(const key of primaryKeys){

    primaryKey[key] =
      row[key];
  }

  const label =
    primaryKeys
      .map(k =>
        `${k}=${row[k]}`
      )
      .join(', ');

  if(
    !confirm(
      `Delete this record?\n\n${label}\n\nThis cannot be undone.`
    )
  ){
    return;
  }

  try{

    const {
      error
    } = await db.rpc(
      'cr_admin_v54_write',
      {
        p_schema:'public',
        p_table:table,
        p_data:{},
        p_pk:primaryKey,
        p_mode:'delete'
      }
    );

    if(error){
      throw error;
    }

    toast(
      'Record deleted.',
      'success'
    );

    await loadTable();

  }catch(error){

    console.error(error);

    /*
      Compatibility fallback for id-based tables.
    */

    try{

      if(primaryKeys.length !== 1){
        throw error;
      }

      const {
        error:fallbackError
      } = await db.rpc(
        'cr_admin_crud',
        {
          p_action:'delete',
          p_table:table,
          p_id:String(
            row[primaryKeys[0]]
          ),
          p_data:null
        }
      );

      if(fallbackError){
        throw fallbackError;
      }

      toast(
        'Record deleted.',
        'success'
      );

      await loadTable();

    }catch(fallbackError){

      toast(
        'Delete failed: ' +
        errorMessage(fallbackError),
        'error'
      );
    }
  }
}

window.changeMemberRole =
  async function(userId){

    const select =
      document.getElementById(
        'role_' + userId
      );

    if(!select){
      return;
    }

    const role =
      select.value;

    if(
      role === 'owner' ||
      role === 'admin'
    ){

      if(!isOwner()){

        toast(
          'Only the Owner can grant Admin or Owner roles.',
          'error'
        );

        return;
      }
    }

    if(
      !confirm(
        `Change this member's role to "${role}"?`
      )
    ){
      return;
    }

    try{

      const {
        data,
        error
      } = await db.rpc(
        'cr_admin_set_member_role',
        {
          p_user_id:userId,
          p_role:role
        }
      );

      if(error){
        throw error;
      }

      toast(
        `Role changed to ${role}.`,
        'success'
      );

      await renderMembers();

    }catch(error){

      console.error(error);

      toast(
        'Role change failed: ' +
        errorMessage(error),
        'error'
      );
    }
  };

/* =========================================================
   LEADERBOARD
========================================================= */

async function renderLeaderboard(){

  state.currentTable = null;

  $('pageTitle').textContent =
    'CrowPoints Leaderboard';

  $('pageSubtitle').textContent =
    'Lifetime and monthly member engagement';

  content.innerHTML = `
    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">
          Member Leaderboard
        </div>

        <button
          id="leaderRefresh"
          class="btn"
        >
          ↻ Refresh
        </button>

      </div>

      <div class="panel-body">

        <div id="leaderboard"
          class="empty">

          <span class="loader"></span>

          <div style="margin-top:10px">
            Loading leaderboard…
          </div>

        </div>

      </div>

    </div>
  `;

  $('leaderRefresh').onclick =
    renderLeaderboard;

  try{

    const {
      data,
      error
    } = await db.rpc(
      'cr_admin_member_leaderboard',
      {
        p_limit:500
      }
    );

    if(error){
      throw error;
    }

    const rows =
      Array.isArray(data)
        ? data
        : (
          data?.rows ||
          data?.data ||
          []
        );

    $('leaderboard').className =
      'table-wrap';

    $('leaderboard').innerHTML = `
      <table class="data-table">

        <thead>
          <tr>
            <th>Rank</th>
            <th>Member</th>
            <th>Role</th>
            <th>Lifetime Points</th>
            <th>Monthly Points</th>
            <th>Watch Hours</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>

          ${rows.map(row => `

            <tr>

              <td>
                <b>
                  #${formatNumber(row.rank)}
                </b>
              </td>

              <td>
                <b>
                  ${escapeHtml(
                    row.display_name ||
                    row.username ||
                    'Member'
                  )}
                </b>

                <div style="
                  color:#68738a;
                  font-size:9px;
                  margin-top:3px;
                ">
                  @${escapeHtml(
                    row.username ||
                    ''
                  )}
                </div>
              </td>

              <td>
                ${escapeHtml(
                  row.role ||
                  'member'
                )}
              </td>

              <td>
                ${formatNumber(
                  row.lifetime_points || 0
                )}
              </td>

              <td>
                ${formatNumber(
                  row.monthly_points || 0
                )}
              </td>

              <td>
                ${Number(
                  row.watch_hours || 0
                ).toFixed(2)}
              </td>

              <td>
                ${
                  row.is_active
                    ? '<span class="true">ACTIVE</span>'
                    : '<span class="false">INACTIVE</span>'
                }
              </td>

            </tr>

          `).join('')}

        </tbody>

      </table>
    `;

  }catch(error){

    console.error(error);

    $('leaderboard').innerHTML = `
      <div class="empty">
        ${escapeHtml(
          errorMessage(error)
        )}
      </div>
    `;
  }
}

/* =========================================================
   AUDIT LOG
========================================================= */

async function renderAudit(){

  state.currentTable = null;

  $('pageTitle').textContent =
    'Audit Log';

  $('pageSubtitle').textContent =
    'Administrative actions recorded by Supabase';

  content.innerHTML = `
    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">
          Admin Audit Trail
        </div>

        <button
          id="auditRefresh"
          class="btn"
        >
          ↻ Refresh
        </button>

      </div>

      <div class="panel-body">

        <div id="auditList" class="empty">
          <span class="loader"></span>
          <div style="margin-top:10px">
            Loading audit log…
          </div>
        </div>

      </div>

    </div>
  `;

  $('auditRefresh').onclick =
    renderAudit;

  try{

    const {
      data,
      error
    } = await db.rpc(
      'cr_admin_v54_rows',
      {
        p_schema:'public',
        p_table:'cr_admin_audit_log',
        p_limit:100,
        p_offset:0,
        p_order:'created_at',
        p_direction:'desc'
      }
    );

    if(error){
      throw error;
    }

    const normalized =
      normalizeRowsResponse(data);

    const rows =
      normalized.rows;

    if(!rows.length){

      $('auditList').innerHTML = `
        <div class="empty">
          No administrative actions recorded.
        </div>
      `;

      return;
    }

    $('auditList').className =
      'audit-list';

    $('auditList').innerHTML =
      rows.map(row => `

        <div class="audit-row">

          <div class="audit-action">
            ${escapeHtml(
              row.action ||
              'admin_action'
            )}
          </div>

          <div class="audit-meta">

            ${
              row.target_table
                ? escapeHtml(
                    row.target_table
                  )
                : 'system'
            }

            ${
              row.target_id
                ? ' · ' +
                  escapeHtml(
                    row.target_id
                  )
                : ''
            }

            ${
              row.created_at
                ? ' · ' +
                  escapeHtml(
                    formatDate(
                      row.created_at
                    )
                  )
                : ''
            }

          </div>

          ${
            row.metadata
              ? `
                <div class="audit-json">
                  ${escapeHtml(
                    typeof row.metadata === 'string'
                      ? row.metadata
                      : JSON.stringify(
                          row.metadata,
                          null,
                          2
                        )
                  )}
                </div>
              `
              : ''
          }

        </div>

      `).join('');

  }catch(error){

    console.error(error);

    $('auditList').innerHTML = `
      <div class="empty">

        <div class="empty-icon">⚠</div>

        Unable to load audit log.

        <p>
          ${escapeHtml(
            errorMessage(error)
          )}
        </p>

      </div>
    `;
  }
}

/* =========================================================
   GLOBAL KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  'keydown',
  event => {

    if(
      event.key === 'Escape' &&
      !$('modalBackdrop').classList.contains('hidden')
    ){

      closeModal();
    }

    if(
      event.ctrlKey &&
      event.key.toLowerCase() === 'k'
    ){

      event.preventDefault();

      const input =
        document.getElementById(
          'tableSearch'
        );

      if(input){
        input.focus();
      }
    }
  }
);

/* =========================================================
   START
========================================================= */

initialize();

</script>
