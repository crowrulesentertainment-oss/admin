function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function pretty(s){return s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())}
function fmt(v){
 if(v===null||v===undefined||v==="") return "—";
 if(typeof v==="object") return esc(JSON.stringify(v));
 return esc(v);
}
function isSystemColumn(c){return ["created_at","updated_at"].includes(c.name)}
function inputType(c){
 if(c.data_type==="boolean") return "boolean";
 if(c.data_type==="jsonb"||c.data_type==="json") return "json";
 if(c.data_type.includes("timestamp")) return "datetime-local";
 if(c.data_type==="date") return "date";
 if(c.data_type.includes("int")||c.data_type==="numeric"||c.data_type==="double precision") return "number";
 if(c.data_type==="text" && ["body","description","message","bio","story","transcript","show_notes","metadata"].some(x=>c.name.includes(x))) return "textarea";
 return "text";
}
function defaultValue(c){
 if(!c.default) return c.data_type==="boolean" ? false : "";
 const d=c.default;
 if(d.includes("true")) return true;
 if(d.includes("false")) return false;
 return "";
}

async function boot(){
 document.getElementById("clock").textContent=new Date().toLocaleString();
 setInterval(()=>document.getElementById("clock").textContent=new Date().toLocaleString(),1000);
 const {data:{session}}=await sb.auth.getSession();
 if(!session){showLogin();return}
 const {data:isAdmin,error}=await sb.rpc("crowrules_is_admin");
 if(error||!isAdmin){showLogin("Your account is signed in, but it is not authorized as a CrowRules administrator.");return}
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("adminChip").textContent=(session.user.email||"ADMIN").toUpperCase();
 buildNav();
 await loadSchema();
 await showSection("dashboard");
}
function showLogin(msg){
 document.getElementById("loginView").classList.remove("hidden");
 if(msg) document.getElementById("loginMessage").textContent=msg;
}

 if(!email)return;
 const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});
 if(error) toast(error.message,true); else toast("Magic-link sign-in sent. Check your email.");
}
async function signOut(){
 await sb.auth.signOut();location.reload();
}
function buildNav(){
 const nav=document.getElementById("nav");
 nav.innerHTML=MODULES.map(g=>`<div class="nav-group"><div class="nav-title">${g.group}</div>${g.items.map(x=>`<button data-key="${x[0]}" onclick="${x[0]==="signout"?"signOut()":"showSection('"+x[0]+"')"}"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join("")}</div>`).join("");
}
async function loadSchema(){
 const {data,error}=await sb.rpc("crowrules_admin_schema");
 if(error){toast("Schema metadata failed: "+error.message,true);return}
 schema={};
 (data||[]).forEach(t=>schema[t.table_name]=t);
}
function moduleByKey(key){
 for(const g of MODULES) for(const x of g.items) if(x[0]===key)return x;
}
async function showSection(key){
 current=key;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.key===key));
 if(key==="dashboard"){renderDashboard();return}
 if(key==="settings"){renderSettings();return}
 if(key==="database"){renderDatabase();return}
 const mod=moduleByKey(key);
 if(!mod||!mod[3]){document.getElementById("content").innerHTML=`<div class="hero"><div class="eyebrow">CrowRules Admin</div><h1>${pretty(key)}</h1><p>This administration section is available in the single-file console. Select a database-backed module from the navigation.</p></div>`;return}
 await renderTableModule(mod[3],mod[2]);
 document.getElementById("sidebar").classList.remove("open");
}
async function renderDashboard(){
 const tables=["members","shows","episodes","sports_teams","sports_games","memorials","podcasts","articles","shop_products"];
 const counts=await Promise.all(tables.map(async t=>{
  const {count,error}=await sb.from(t).select("*",{count:"exact",head:true});
  return [t,error?null:count];
 }));
 document.getElementById("content").innerHTML=`
 <div class="hero"><div class="eyebrow">Command Center • Live Database</div><h1>CrowRules Administration</h1><p>Single-file control center connected directly to the CrowRules Supabase project. Modules use live schema metadata and real database CRUD instead of placeholder forms.</p>
 <div class="actions"><button class="btn primary" onclick="showSection('shows')">Manage Shows</button><button class="btn" onclick="showSection('members')">Manage Members</button><button class="btn" onclick="showSection('sports-teams')">Sports Teams</button><button class="btn" onclick="showSection('activity')">Activity</button><button class="btn" onclick="loadSchema().then(()=>toast('Schema refreshed'))">Refresh Schema</button></div></div>
 <div class="stats">${counts.map(([t,c])=>`<div class="stat"><small>${pretty(t)}</small><strong>${c===null?"—":c}</strong></div>`).join("")}</div>
 <div class="section-head"><h2>Administration Modules</h2><span class="muted">${Object.keys(schema).length} database tables detected</span></div>
 <div class="grid">${MODULES.flatMap(g=>g.items.filter(x=>x[3]&&x[3]!=="__database__")).map(x=>`<div class="card module" onclick="showSection('${x[0]}')" style="cursor:pointer"><h3>${x[1]} ${x[2]}</h3><p>${schema[x[3]]?`Connected to public.${x[3]}.`:"Table unavailable or not exposed."} ${schema[x[3]]?`Primary key: ${(schema[x[3]].primary_keys||[]).join(", ")||"none"}.`:""}</p></div>`).join("")}</div>`;
}
async function renderTableModule(table,title){
 const meta=schema[table];
 if(!meta){document.getElementById("content").innerHTML=`<div class="hero"><h1>${esc(title)}</h1><p class="danger-text">Table <b>${esc(table)}</b> was not returned by the admin schema service.</p><button class="btn" onclick="loadSchema().then(()=>showSection(current))">Retry Schema</button></div>`;return}
 document.getElementById("content").innerHTML=`<div class="section-head"><div><div class="eyebrow">Database Module</div><h2>${esc(title)}</h2><div class="muted">public.${esc(table)} • ${(meta.primary_keys||[]).join(", ")||"no declared primary key"}</div></div><button class="btn primary" onclick="openCreate('${table}')">＋ Add ${esc(title.replace(/s$/,""))}</button></div>
 <div class="toolbar"><input class="grow" id="moduleFilter" placeholder="Filter rows..." oninput="drawRows()"><button class="btn" onclick="loadRows('${table}')">↻ Refresh</button><button class="btn" onclick="exportCSV()">Export CSV</button></div>
 <div id="tableArea" class="table-wrap"><div class="loading">Loading ${esc(table)}…</div></div>`;
 await loadRows(table);
}
async function loadRows(table){
 const area=document.getElementById("tableArea"); if(area) area.innerHTML='<div class="loading">Loading…</div>';
 const {data,error}=await sb.from(table).select("*").limit(500);
 if(error){if(area)area.innerHTML=`<div class="empty"><div class="danger-text">Database error</div><p>${esc(error.message)}</p></div>`;return}
 currentRows=data||[]; drawRows();
}
function drawRows(){
 const area=document.getElementById("tableArea");if(!area)return;
 const q=(document.getElementById("moduleFilter")?.value||document.getElementById("globalSearch")?.value||"").toLowerCase();
 const rows=currentRows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
 const meta=schema[moduleByKey(current)?.[3]]||schema[current];
 const cols=meta?.columns||Object.keys(rows[0]||{}).map(name=>({name}));
 if(!rows.length){area.innerHTML='<div class="empty">No records found.</div>';return}
 const displayCols=cols.slice(0,12);
 area.innerHTML=`<table><thead><tr>${displayCols.map(c=>`<th>${pretty(c.name)}</th>`).join("")}<th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr>${displayCols.map(c=>`<td>${fmt(r[c.name])}</td>`).join("")}<td><div class="row-actions"><button class="btn mini" onclick='openEdit(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button><button class="btn mini danger" onclick='deleteRow(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Delete</button></div></td></tr>`).join("")}</tbody></table>`;
}
function formFor(table,row={}){
 const meta=schema[table], pk=meta.primary_keys||[];
 return `<form id="recordForm" class="form" onsubmit="saveRecord(event,'${table}')"><div class="form-grid">${meta.columns.filter(c=>!isSystemColumn(c)&&!(pk.includes(c.name)&&c.default)).map(c=>{
  const type=inputType(c), val=row[c.name]??defaultValue(c), required=!c.is_nullable&&!c.default&&!pk.includes(c.name);
  if(type==="boolean")return `<div class="field checkbox"><input id="f_${c.name}" type="checkbox" ${val===true?"checked":""}><label for="f_${c.name}">${pretty(c.name)}</label></div>`;
  if(type==="textarea")return `<div class="field full"><label>${pretty(c.name)}</label><textarea id="f_${c.name}" ${required?"required":""}>${esc(type==="json"&&typeof val==="object"?JSON.stringify(val,null,2):val)}</textarea></div>`;
  return `<div class="field"><label>${pretty(c.name)}</label><input id="f_${c.name}" type="${type}" value="${esc(type==="datetime-local"&&val?new Date(val).toISOString().slice(0,16):val)}" ${required?"required":""}></div>`;
 }).join("")}</div><div class="form-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">${row.id?"Save Changes":"Create Record"}</button></div></form>`;
}
function openCreate(table){editing=null;document.getElementById("modalTitle").textContent="Create • "+pretty(table);document.getElementById("modalBody").innerHTML=formFor(table,{});document.getElementById("modal").classList.add("open")}
function openEdit(row){
 const table=moduleByKey(current)?.[3]; if(!table)return;
 editing=row;document.getElementById("modalTitle").textContent="Edit • "+pretty(table);document.getElementById("modalBody").innerHTML=formFor(table,row);document.getElementById("modal").classList.add("open");
}
async function saveRecord(e,table){
 e.preventDefault(); const meta=schema[table], payload={};
 meta.columns.filter(c=>!isSystemColumn(c)).forEach(c=>{
  if(meta.primary_keys?.includes(c.name)&&!editing)return;
  const el=document.getElementById("f_"+c.name);if(!el)return;
  let v=c.data_type==="boolean"?el.checked:el.value;
  if(v==="" && c.is_nullable)v=null;
  if(c.data_type==="jsonb"||c.data_type==="json"){try{v=v?JSON.parse(v):{} }catch(err){toast("Invalid JSON in "+c.name,true);return}}
  if(c.data_type.includes("int")||c.data_type==="numeric"||c.data_type==="double precision"){if(v!==""&&v!==null)v=Number(v)}
  if(c.data_type.includes("timestamp")&&v)v=new Date(v).toISOString();
  payload[c.name]=v;
 });
 let query;
 if(editing){
  const filter={};(meta.primary_keys||[]).forEach(k=>filter[k]=editing[k]);
  query=sb.from(table).update(payload);
  Object.entries(filter).forEach(([k,v])=>query=query.eq(k,v));
 }else query=sb.from(table).insert(payload);
 const {error}=await query;
 if(error){toast("Save failed: "+error.message,true);return}
 await logActivity(editing?"update":"create",table,editing?editing[meta.primary_keys?.[0]]:null);
 closeModal();toast(editing?"Record updated":"Record created");await loadRows(table);
}
async function deleteRow(row){
 const table=moduleByKey(current)?.[3], meta=schema[table];if(!meta)return;
 if(!confirm("Delete this record? This cannot be undone."))return;
 let q=sb.from(table).delete();(meta.primary_keys||[]).forEach(k=>q=q.eq(k,row[k]));
 const {error}=await q;if(error){toast("Delete failed: "+error.message,true);return}
 await logActivity("delete",table,row[meta.primary_keys?.[0]]);toast("Record deleted");await loadRows(table);
}
async function logActivity(type,table,id){
 try{await sb.rpc("crowrules_admin_log",{p_event_type:type,p_title:`Admin ${type}: ${table}`,p_description:`${type} operation in ${table}`,p_entity_type:table,p_entity_id:id||null,p_source:"admin",p_severity:type==="delete"?"warning":"success",p_metadata:{module:table}})}catch(e){}
}
function renderDatabase(){
 const names=Object.keys(schema).sort();
 document.getElementById("content").innerHTML=`<div class="hero"><div class="eyebrow">Infrastructure</div><h1>Database Explorer</h1><p>Every public base table returned by the protected admin schema service is available here. Choose a table to inspect and manage it.</p></div><div class="section-head"><h2>${names.length} Tables</h2></div><div class="grid">${names.map(t=>`<div class="card module" onclick="openTableDirect('${t}')"><h3>${pretty(t)}</h3><p>public.${t}<br>Primary: ${(schema[t].primary_keys||[]).join(", ")||"none"}<br>${schema[t].columns.length} columns</p></div>`).join("")}</div>`;
}
async function openTableDirect(t){
 const fake=MODULES.flatMap(g=>g.items).find(x=>x[3]===t);
 if(fake){await showSection(fake[0]);return}
 current="";document.getElementById("content").innerHTML=`<div class="section-head"><div><div class="eyebrow">Database Explorer</div><h2>${pretty(t)}</h2></div><button class="btn primary" onclick="openCreate('${t}')">＋ Add Record</button></div><div class="toolbar"><input class="grow" id="moduleFilter" placeholder="Filter rows..." oninput="drawRows()"><button class="btn" onclick="loadRows('${t}')">↻ Refresh</button></div><div id="tableArea" class="table-wrap"><div class="loading">Loading…</div></div>`;
 currentRows=[];await loadRows(t);
 window.__directTable=t;
}
function renderSettings(){
 document.getElementById("content").innerHTML=`<div class="hero"><div class="eyebrow">System</div><h1>Admin Settings</h1><p>Supabase project configuration and administrative controls for this single-file console.</p><div class="actions"><button class="btn" onclick="loadSchema().then(()=>toast('Schema refreshed'))">Refresh Schema</button><button class="btn" onclick="location.reload()">Reload Console</button><button class="btn danger" onclick="signOut()">Sign Out</button></div></div><div class="grid"><div class="card module"><h3>Supabase</h3><p>${SUPABASE_URL}</p></div><div class="card module"><h3>Authorization</h3><p>Admin access is checked through <b>crowrules_is_admin()</b>. Database operations remain subject to Supabase RLS.</p></div><div class="card module"><h3>Schema Service</h3><p>Protected RPC: <b>crowrules_admin_schema()</b>. It supplies current public-table and column metadata so forms don't rely on stale hard-coded schemas.</p></div></div>`;
}
function exportCSV(){
 if(!currentRows.length){toast("Nothing to export",true);return}
 const cols=Object.keys(currentRows[0]);const lines=[cols.join(",")].concat(currentRows.map(r=>cols.map(c=>`"${String(typeof r[c]==="object"?JSON.stringify(r[c]):r[c]??"").replace(/"/g,'""')}"`).join(",")));
 const blob=new Blob([lines.join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(moduleByKey(current)?.[3]||window.__directTable||"export")+".csv";a.click();URL.revokeObjectURL(a.href);
}
function closeModal(){document.getElementById("modal").classList.remove("open");editing=null}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open")}
function renderCurrent(){if(current==="dashboard")renderDashboard();else if(current==="database")renderDatabase();else if(current==="settings")renderSettings();else {const m=moduleByKey(current);if(m?.[3])renderTableModule(m[3],m[2])}}
function toast(msg,err=false){const t=document.getElementById("toast");t.textContent=msg;t.className="toast show "+(err?"err":"ok");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.className="toast",3500)}
sb.auth.onAuthStateChange(()=>{});
boot();
</script>
</body>
</html>
