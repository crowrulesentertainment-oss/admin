<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CrowRules Entertainment — Universal Admin</title>

<meta name="theme-color" content="#050505">
<meta name="description" content="CrowRules Entertainment Universal Supabase Administration and Dream World Command Center">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050505;
  --panel:#0d0d11;
  --panel2:#111117;
  --panel3:#15151c;
  --line:#27272f;
  --line2:#3a3a46;
  --text:#f5f5f7;
  --muted:#8d8d98;

  --accent:#b66cff;
  --accent2:#6c5cff;
  --cyan:#37d7ff;
  --green:#45e69a;
  --yellow:#f3c969;
  --red:#ff526d;
  --orange:#ff8a4c;

  --dream:#c78cff;
  --dream2:#7157ff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Montserrat,system-ui,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 85% 5%,rgba(182,108,255,.13),transparent 32%),
    radial-gradient(circle at 10% 90%,rgba(55,215,255,.06),transparent 30%);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   APP
========================================================= */

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:285px;
  background:rgba(9,9,12,.98);
  border-right:1px solid var(--line);
  overflow:auto;
  z-index:50;
}

.brand{
  padding:22px 20px;
  border-bottom:1px solid var(--line);
}

.brand b{
  font:800 19px Orbitron;
}

.brand small{
  display:block;
  color:var(--muted);
  margin-top:5px;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.nav{
  padding:12px;
}

.nav-group{
  margin:13px 0;
}

.nav-title{
  padding:8px 10px;
  color:#6e6e78;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.6px;
  text-transform:uppercase;
}

.nav-title.dream-title{
  color:var(--dream);
}

.nav button{
  display:flex;
  width:100%;
  align-items:center;
  gap:10px;
  border:1px solid transparent;
  background:transparent;
  color:#b8b8c1;
  padding:10px;
  border-radius:9px;
  text-align:left;
  margin:2px 0;
  transition:.15s ease;
}

.nav button:hover,
.nav button.active{
  background:
    linear-gradient(
      90deg,
      rgba(182,108,255,.16),
      rgba(108,92,255,.07)
    );
  border-color:rgba(182,108,255,.25);
  color:#fff;
}

.nav button.dream-item:hover,
.nav button.dream-item.active{
  background:
    linear-gradient(
      90deg,
      rgba(199,140,255,.18),
      rgba(113,87,255,.09)
    );
  border-color:rgba(199,140,255,.30);
}

.nav .ico{
  width:22px;
  min-width:22px;
  text-align:center;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  margin-left:285px;
  width:calc(100% - 285px);
  min-width:0;
}

.topbar{
  height:70px;
  border-bottom:1px solid var(--line);
  background:rgba(7,7,9,.90);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:40;
}

.hamb{
  display:none;
  border:1px solid var(--line);
  background:var(--panel);
  color:#fff;
  border-radius:8px;
  padding:9px;
}

.search{
  flex:1;
  max-width:700px;
  position:relative;
}

.search input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:#fff;
  border-radius:10px;
  padding:11px 14px 11px 40px;
  outline:none;
}

.search input:focus{
  border-color:rgba(182,108,255,.55);
  box-shadow:0 0 0 3px rgba(182,108,255,.08);
}

.search span{
  position:absolute;
  left:14px;
  top:10px;
  color:var(--muted);
}

.clock{
  color:var(--muted);
  font:600 11px Orbitron;
  white-space:nowrap;
}

.admin-chip{
  border:1px solid rgba(69,230,154,.25);
  background:rgba(69,230,154,.08);
  color:var(--green);
  border-radius:999px;
  padding:8px 11px;
  font-size:10px;
  font-weight:800;
  max-width:280px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.content{
  padding:26px;
  max-width:1900px;
  margin:auto;
}

/* =========================================================
   HERO
========================================================= */

.hero{
  padding:28px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(
      135deg,
      rgba(182,108,255,.12),
      rgba(17,17,23,.92) 45%,
      rgba(55,215,255,.05)
    );
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.hero.dream{
  background:
    radial-gradient(
      circle at 85% 15%,
      rgba(199,140,255,.20),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      rgba(113,87,255,.17),
      rgba(17,17,23,.95) 48%,
      rgba(199,140,255,.07)
    );
  border-color:rgba(199,140,255,.28);
}

.eyebrow{
  color:var(--accent);
  font:800 10px Orbitron;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hero.dream .eyebrow{
  color:var(--dream);
}

.hero h1{
  font:800 30px Orbitron;
  margin:9px 0;
}

.hero p{
  color:var(--muted);
  max-width:900px;
  margin:0;
  line-height:1.7;
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:20px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  border:1px solid var(--line2);
  background:var(--panel2);
  color:#fff;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
  transition:.15s ease;
}

.btn:hover{
  border-color:#555562;
  transform:translateY(-1px);
}

.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;
}

.btn.dream{
  background:linear-gradient(135deg,var(--dream),var(--dream2));
  border-color:transparent;
}

.btn.danger{
  color:var(--red);
  border-color:rgba(255,82,109,.3);
}

.btn.success{
  color:var(--green);
  border-color:rgba(69,230,154,.3);
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.mini{
  padding:6px 8px;
  border-radius:7px;
  font-size:10px;
}

/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
  margin:16px 0;
}

.stat,
.card{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:14px;
}

.stat{
  padding:17px;
}

.stat small{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.stat strong{
  display:block;
  font:800 25px Orbitron;
  margin-top:7px;
}

.stat.dream-stat{
  border-color:rgba(199,140,255,.22);
  background:
    linear-gradient(
      135deg,
      rgba(199,140,255,.08),
      var(--panel)
    );
}

/* =========================================================
   SECTIONS
========================================================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:25px 0 12px;
}

.section-head h2{
  font:700 17px Orbitron;
  margin:0;
}

.muted{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.module{
  padding:18px;
  min-height:130px;
  transition:.15s ease;
}

.module:hover{
  transform:translateY(-2px);
  border-color:#41414d;
}

.module.dream-module{
  border-color:rgba(199,140,255,.20);
}

.module h3{
  margin:0 0 8px;
  font:700 14px Orbitron;
}

.module p{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.toolbar input,
.toolbar select,
.form input,
.form select,
.form textarea{
  background:#09090c;
  border:1px solid var(--line2);
  color:#fff;
  border-radius:8px;
  padding:10px;
  outline:none;
  width:100%;
}

.toolbar input:focus,
.toolbar select:focus,
.form input:focus,
.form select:focus,
.form textarea:focus{
  border-color:rgba(182,108,255,.55);
}

.toolbar .grow{
  flex:1;
  min-width:220px;
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:auto;
  background:var(--panel);
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:900px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:11px;
  vertical-align:top;
}

th{
  font:700 10px Orbitron;
  color:#a9a9b2;
  background:#101016;
  position:sticky;
  top:0;
  z-index:1;
}

td{
  color:#d4d4da;
  max-width:360px;
  word-break:break-word;
}

tr:hover td{
  background:rgba(182,108,255,.035);
}

.row-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:45px;
  color:var(--muted);
}

.loading{
  padding:45px;
  text-align:center;
  color:var(--cyan);
}

.error-box{
  padding:28px;
  color:var(--red);
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(1000px,100%);
  max-height:92vh;
  overflow:auto;
  background:#0b0b0f;
  border:1px solid var(--line2);
  border-radius:16px;
  box-shadow:0 30px 100px #000;
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:#0b0b0f;
  z-index:2;
}

.modal-head h3{
  margin:0;
  font:700 16px Orbitron;
}

.modal-body{
  padding:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:10px;
  color:#a9a9b2;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.field.checkbox{
  flex-direction:row;
  align-items:center;
}

.field.checkbox input{
  width:auto;
}

.field small{
  color:var(--muted);
  font-size:9px;
}

.form-foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid var(--line);
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#101016;
  border:1px solid var(--line2);
  padding:13px 16px;
  border-radius:10px;
  box-shadow:0 15px 50px #000;
  z-index:200;
  display:none;
  max-width:480px;
  font-size:12px;
}

.toast.show{
  display:block;
}

.toast.ok{
  border-color:rgba(69,230,154,.4);
}

.toast.err{
  border-color:rgba(255,82,109,.5);
}

/* =========================================================
   LOGIN
========================================================= */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginbox{
  width:min(480px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:30px;
  text-align:center;
  box-shadow:0 30px 100px #000;
}

.loginbox h1{
  font:800 23px Orbitron;
}

.loginbox p{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.login-email{
  margin:18px 0 10px;
}

.login-email input{
  width:100%;
  background:#09090c;
  border:1px solid var(--line2);
  color:#fff;
  border-radius:9px;
  padding:12px;
  outline:none;
}

.login-status{
  min-height:20px;
  margin:12px 0;
  color:var(--muted);
  font-size:11px;
}

/* =========================================================
   HEALTH
========================================================= */

.health-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.health-card{
  padding:18px;
}

.health-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
  margin-right:7px;
  background:var(--green);
  box-shadow:0 0 12px rgba(69,230,154,.5);
}

.health-dot.bad{
  background:var(--red);
  box-shadow:0 0 12px rgba(255,82,109,.5);
}

.health-dot.warn{
  background:var(--yellow);
  box-shadow:0 0 12px rgba(243,201,105,.5);
}

/* =========================================================
   DREAM DASHBOARD
========================================================= */

.dream-banner{
  position:relative;
  overflow:hidden;
}

.dream-banner:after{
  content:"✦";
  position:absolute;
  right:55px;
  top:25px;
  color:rgba(199,140,255,.18);
  font-size:100px;
  font-family:Orbitron;
}

.dream-cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-top:16px;
}

.dream-card{
  padding:18px;
  border:1px solid rgba(199,140,255,.22);
  background:
    linear-gradient(
      135deg,
      rgba(199,140,255,.08),
      rgba(17,17,23,.96)
    );
  border-radius:14px;
}

.dream-card small{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:9px;
}

.dream-card strong{
  display:block;
  font:800 27px Orbitron;
  margin-top:8px;
  color:#fff;
}

.dream-card span{
  display:block;
  color:var(--dream);
  margin-top:6px;
  font-size:10px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1200px){
  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .dream-cards{
    grid-template-columns:repeat(2,1fr);
  }

  .health-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:none;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .hamb{
    display:block;
  }

  .topbar{
    padding:0 12px;
  }

  .clock{
    display:none;
  }

  .content{
    padding:15px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

  .dream-cards{
    grid-template-columns:1fr;
  }

  .health-grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .search{
    max-width:none;
  }

  .admin-chip{
    display:none;
  }

  .hero{
    padding:21px;
  }

  .hero h1{
    font-size:23px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     LOGIN

<div id="loginView" class="login hidden">

      CrowRules Entertainment

</div>

  </div>

</div>


<div
  class="toast"

></div>

/* =========================================================
   UTILITIES
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));

}


function pretty(value){

  if(!value) return "";

  return String(value)
    .replace(/^dream_/,"")
    .replace(/_/g," ")
    .replace(/\b\w/g,c=>c.toUpperCase());

}


function formatValue(value){

  if(value === null ||
     value === undefined ||
     value === "")
    return "—";

  if(Array.isArray(value))
    return esc(value.join(", "));

  if(typeof value === "object")
    return esc(JSON.stringify(value));

  return esc(value);

}


function isSystemColumn(column){

  return [
    "created_at",
    "updated_at"
  ].includes(column.name);

}


function isArrayColumn(column){

  return column.data_type === "ARRAY" ||
         column.format?.startsWith("_");

}


function isJsonColumn(column){

  return [
    "json",
    "jsonb"
  ].includes(column.data_type);

}


function inputType(column){

  if(column.data_type === "boolean")
    return "boolean";

  if(isArrayColumn(column))
    return "array";

  if(isJsonColumn(column))
    return "json";

  if(
    column.data_type?.includes("timestamp")
  )
    return "datetime-local";

  if(column.data_type === "date")
    return "date";

  if(
    column.data_type?.includes("int") ||
    column.data_type === "numeric" ||
    column.data_type === "double precision" ||
    column.data_type === "real"
  )
    return "number";

  const longTextNames = [
    "body",
    "description",
    "message",
    "bio",
    "story",
    "transcript",
    "show_notes",
    "metadata",
    "content",
    "details",
    "notes",
    "summary",
    "pitch",
    "synopsis",
    "logline",
    "statement"
  ];

  if(
    column.data_type === "text" &&
    longTextNames.some(x =>
      column.name.toLowerCase().includes(x)
    )
  )
    return "textarea";

  return "text";

}


function defaultValue(column){

  if(!column.default_value)
    return column.data_type === "boolean"
      ? false
      : "";

  const d =
    String(column.default_value)
      .toLowerCase();

  if(d.includes("true"))
    return true;

  if(d.includes("false"))
    return false;

  if(d.includes("now()"))
    return "";

  if(d.includes("gen_random_uuid"))
    return "";

  if(d.includes("array[]"))
    return [];

  return "";

}


/* =========================================================

========================================================= */

async function boot(){

  updateClock();

  setInterval(
    updateClock,
    1000
  );

  const {
    data:{
      user
    },
    error:userError
  } =
    await sb.auth.getUser();

  if(userError || !user){

    showLogin();

    return;

  }

  currentUser = user;

  const {
    data:isAdmin,
    error:adminError
  } =
    await sb.rpc(
      "crowrules_is_admin"
    );

  if(
    adminError ||
    isAdmin !== true
  ){

    showLogin(
      "Your account is signed in, but it is not authorized as a CrowRules administrator."
    );

    return;

  }

  showApp();

}


function showApp(){

  document
    .getElementById("loginView")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("adminChip")
    .textContent =
      (
        currentUser?.email ||
        "ADMIN"
      ).toUpperCase();

  buildNav();

  loadSchema()
    .then(()=>{
      buildNav();
      showSection("dashboard");
    });

}


function showLogin(message){

  document
    .getElementById("loginView")
    .classList.remove("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");

  if(message){

    document
      .getElementById("loginMessage")
      .textContent = message;

  }

}


async function signIn(){

  const input =
    document.getElementById("loginEmail");

  const email =
    input.value.trim();

  if(!email){

    setLoginStatus(
      "Enter your administrator email address.",
      true
    );

    return;

  }

  setLoginStatus(
    "Sending secure magic link..."
  );

  const {
    error
  } =
    await sb.auth.signInWithOtp({
      email,
      options:{
        emailRedirectTo:
          window.location.href
      }
    });

  if(error){

    setLoginStatus(
      error.message,
      true
    );

    return;

  }

  setLoginStatus(
    "Magic link sent. Check your email."
  );

}


function setLoginStatus(
  message,
  error=false
){

  const el =
    document.getElementById(
      "loginStatus"
    );

  el.textContent =
    message;

  el.style.color =
    error
      ? "var(--red)"
      : "var(--muted)";

}


async function signOut(){

  await sb.auth.signOut();

  window.location.reload();

}


sb.auth.onAuthStateChange(

    if(event === "SIGNED_OUT"){

function getAllModules(){

  const result =
    STATIC_MODULES.map(group=>({
      ...group,
      items:[
        ...group.items
      ]
    }));

  if(dreamTables.length){

    const dreamItems =
      dreamTables.map(
        (table,index)=>[
          "dream:"+table,
          DREAM_ICONS[
            index % DREAM_ICONS.length
          ],
          DREAM_LABEL_OVERRIDES[table] ||
            pretty(table),
          table
        ]
      );

    result.splice(
      result.length - 1,
      0,
      {
        group:"DREAM WORLD",
        dream:true,
        items:[
          [
            "dream-dashboard",
            "✦",
            "Dream World Dashboard",
            null
          ],
          ...dreamItems
        ]
      }
    );

  }

  return result;

}


function buildNav(){

  const nav =

  const groups =
    getAllModules();

  nav.innerHTML =
    groups.map(group=>`

        }

/* =========================================================
   SCHEMA
========================================================= */

async function loadSchema(){

  const {
    data,
    error
  } =
    await sb.rpc(
      "crowrules_admin_schema"
    );

  if(error){

    schemaLoaded = false;

    toast(
      "Schema metadata failed: " +
      error.message,
      true
    );

    return false;

  }

  schema = {};

  let tables = [];

  /*
    crowrules_admin_schema() returns JSONB.
    Support either:
      [ ... ]
    or:
      { tables:[ ... ] }
  */

  if(Array.isArray(data)){

    tables = data;

  }else if(
    data &&
    Array.isArray(data.tables)
  ){

    tables = data.tables;

  }else if(data){

    /*
      Some implementations return an
      object keyed by table name.
    */

    tables =
      Object.entries(data)
        .map(([table_name,value])=>({
          table_name,
          ...value
        }));

  }

  tables.forEach(table=>{

    const tableName =
      table.table_name ||
      table.name;

    if(!tableName)
      return;

    schema[tableName] = {

      table_name:tableName,

      columns:
        table.columns ||
        [],

      primary_keys:
        table.primary_keys ||
        [],

      foreign_keys:
        table.foreign_keys ||
        table.foreign_key_constraints ||
        [],

      row_count:
        table.row_count ??
        table.rows ??
        null

    };

  });

  dreamTables =
    Object.keys(schema)
      .filter(
        name =>
          name.startsWith("dream_")
      )
      .sort();

  schemaLoaded = true;

  return true;

}


/* =========================================================
   MODULE LOOKUP
========================================================= */

function findModuleByKey(key){

  for(
    const group of getAllModules()
  ){

    for(
      const item of group.items
    ){

      if(item[0] === key)
        return item;

    }

  }

  return null;

}


function tableForCurrent(){

  if(
    current.startsWith("dream:")
  )
    return current.substring(6);

  const module =
    findModuleByKey(current);

  return module?.[3] || currentTable;

}

async function showSection(key){

  current = key;

  document
    .querySelectorAll(".nav button")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.key === key
      );

    });

  if(key === "dashboard"){

    await renderDashboard();
    return;

  }

  if(key === "dream-dashboard"){

    await renderDreamDashboard();
    return;

  }

  if(key === "system-health"){

    await renderSystemHealth();
    return;

  }

  if(key === "settings"){

    renderSettings();
    return;

  }

  if(key === "database"){

    renderDatabase();
    return;

  }

  let table = null;
  let title = null;

  if(key.startsWith("dream:")){

    table =
      key.substring(6);

    title =
      DREAM_LABEL_OVERRIDES[table] ||
      pretty(table);

  }else{

    const module =
      findModuleByKey(key);

    if(module){

      table = module[3];
      title = module[2];

    }

  }

  if(!table){

    document
      .getElementById("content")
      .innerHTML = `
        <div class="hero">
          <div class="eyebrow">
            CrowRules Admin
          </div>
          <h1>
            ${esc(pretty(key))}
          </h1>
          <p>
            This administration module does not have
            a database table assigned to it.
          </p>
        </div>
      `;

    return;

  }

  await renderTableModule(
    table,
    title,
    key.startsWith("dream:")
  );

  document
    .getElementById("sidebar")
    .classList.remove("open");

}

/* =========================================================
   LOAD ROWS
========================================================= */

async function loadRows(table){

  currentTable = table;

  const area =
    document.getElementById(
      "tableArea"
    );

  if(area){

    area.innerHTML =
      `<div class="loading">
        Loading…
      </div>`;

  }

  const {
    data,
    error
  } =
    await sb
      .from(table)
      .select("*")
      .limit(500);

  if(error){

    currentRows = [];

    if(area){

      area.innerHTML = `

        <div class="error-box">

          <div class="danger-text">
            Database error
          </div>

          <p>
            ${esc(error.message)}
          </p>

          <p class="muted">
            The request is still subject to
            Supabase authentication and RLS.
          </p>

        </div>

      `;

    }

    return;

  }

  currentRows =
    data || [];

  drawRows();

}


/* =========================================================
   DRAW ROWS
========================================================= */

function drawRows(){

  const area =
    document.getElementById(
      "tableArea"
    );

  if(!area)
    return;

  const query =
    (
      document.getElementById(
        "moduleFilter"
      )?.value ||
      document.getElementById(
        "globalSearch"
      )?.value ||
      ""
    )
      .trim()
      .toLowerCase();

  currentDisplayRows =
    currentRows.filter(row=>{

      if(!query)
        return true;

      return JSON.stringify(row)
        .toLowerCase()
        .includes(query);

    });

  const meta =
    schema[currentTable];

  const columns =
    meta?.columns ||
    Object.keys(
      currentDisplayRows[0] || {}
    ).map(name=>({
      name
    }));

  if(!currentDisplayRows.length){

    area.innerHTML =
      `<div class="empty">
        No records found.
      </div>`;

    return;

  }

  /*
    Keep the table readable while allowing
    full editing through the modal.
  */

  const displayColumns =
    columns.slice(0,14);

  area.innerHTML = `

    <table>

      <thead>

        <tr>

          ${
            displayColumns
              .map(
                column=>`
                  <th>
                    ${esc(
                      pretty(column.name)
                    )}
                  </th>
                `
              ).join("")
          }

          <th>
            Actions
          </th>

        </tr>

      </thead>

      <tbody>

        ${
          currentDisplayRows
            .map(
              (row,index)=>`

                <tr>

                  ${
                    displayColumns
                      .map(
                        column=>`

                              row[column.name]
                            )}
                          </td>
                        `
                      ).join("")
                  }

                      <button

/* =========================================================
   FORM
========================================================= */

function formFor(
  table,
  row={}
){

  const meta =
    schema[table];

  if(!meta)
    return "";

  const primaryKeys =
    meta.primary_keys || [];

  const fields =
    meta.columns
      .filter(column=>{

        if(
          isSystemColumn(column)
        )
          return false;

        /*
          Don't expose generated identity
          primary keys during creation.
        */

        if(
          !editing &&
          primaryKeys.includes(
            column.name
          ) &&
          column.default_value
        )
          return false;

        return true;

      });

  return `

    <form
      id="recordForm"
      class="form"
      onsubmit="saveRecord(event,'${table}')"
    >

      <div class="form-grid">

        ${
          fields.map(
            column=>{

              const type =
                inputType(column);

              const value =
                row[column.name] ??
                defaultValue(column);

              const required =
                !column.options?.includes(
                  "nullable"
                ) &&
                !column.default_value &&
                !primaryKeys.includes(
                  column.name
                );

              if(type === "boolean"){

                return `

                  <div class="field checkbox">

                    <input
                      id="f_${esc(column.name)}"
                      type="checkbox"
                      ${
                        value === true
                          ? "checked"
                          : ""
                      }
                    >

                    <label
                      for="f_${esc(column.name)}"
                    >
                      ${esc(
                        pretty(column.name)
                      )}
                    </label>

                  </div>

                `;

              }

              if(
                type === "textarea" ||
                type === "json" ||
                type === "array"
              ){

                let textValue = "";

                if(type === "json"){

                  textValue =
                    typeof value === "object"
                      ? JSON.stringify(
                          value,
                          null,
                          2
                        )
                      : value || "";

                }else if(type === "array"){

                  textValue =
                    Array.isArray(value)
                      ? value.join(", ")
                      : value || "";

                }else{

                  textValue =
                    value || "";

                }

                return `

                  <div class="field full">

                    <label>
                      ${esc(
                        pretty(column.name)
                      )}
                    </label>

                    <textarea
                      id="f_${esc(column.name)}"
                      ${
                        required
                          ? "required"
                          : ""
                      }
                      placeholder="${
                        type === "json"
                          ? "Enter valid JSON"
                          : type === "array"
                            ? "Comma-separated values"
                            : ""
                      }"
                    >${esc(
                      textValue
                    )}</textarea>

                    <small>
                      ${esc(
                        column.data_type ||
                        ""
                      )}
                    </small>

                  </div>

                `;

              }

              let inputValue =
                value ?? "";

              if(
                type === "datetime-local" &&
                value
              ){

                try{

                  inputValue =
                    new Date(value)
                      .toISOString()
                      .slice(0,16);

                }catch(e){}

              }

              return `

                <div class="field">

                  <label>
                    ${esc(
                      pretty(column.name)
                    )}
                  </label>

                  <input
                    id="f_${esc(column.name)}"
                    type="${type}"
                    value="${esc(
                      inputValue
                    )}"
                    ${
                      required
                        ? "required"
                        : ""
                    }
                  >

                  <small>
                    ${esc(
                      column.data_type ||
                      ""
                    )}
                  </small>

                </div>

              `;

            }
          ).join("")
        }

      </div>


      <div class="form-foot">

        <button
          type="button"
          class="btn"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="btn primary"
          type="submit"
        >
          ${
            editing
              ? "Save Changes"
              : "Create Record"
          }
        </button>

      </div>

    </form>

  `;

}

/* =========================================================
   SAVE
========================================================= */

async function saveRecord(
  event,
  table
){

  event.preventDefault();

  const meta =
    schema[table];

  if(!meta){

    toast(
      "Schema unavailable.",
      true
    );

    return;

  }

  const payload = {};

  let parseError = null;

  meta.columns
    .filter(
      column =>
        !isSystemColumn(column)
    )
    .forEach(column=>{

      /*
        Don't overwrite generated primary key
        during create.
      */

      if(
        !editing &&
        meta.primary_keys?.includes(
          column.name
        ) &&
        column.default_value
      )
        return;

      const el =
        document.getElementById(
          "f_" + column.name
        );

      if(!el)
        return;

      let value;

      if(
        column.data_type === "boolean"
      ){

        value =
          el.checked;

      }else{

        value =
          el.value;

      }

      if(
        value === "" &&
        column.options?.includes(
          "nullable"
        )
      ){

        value = null;

      }

      if(isJsonColumn(column)){

        if(
          value === "" ||
          value === null
        ){

          value = {};

        }else{

          try{

            value =
              JSON.parse(value);

          }catch(error){

            parseError =
              "Invalid JSON in " +
              column.name;

          }

        }

      }

      if(isArrayColumn(column)){

        if(
          value === "" ||
          value === null
        ){

          value = [];

        }else{

          value =
            value
              .split(",")
              .map(v=>v.trim())
              .filter(Boolean);

        }

      }

      if(
        column.data_type?.includes(
          "int"
        ) ||
        column.data_type === "numeric" ||
        column.data_type === "double precision" ||
        column.data_type === "real"
      ){

        if(
          value !== "" &&
          value !== null
        ){

          value =
            Number(value);

          if(Number.isNaN(value)){

            parseError =
              "Invalid number in " +
              column.name;

          }

        }

      }

      if(
        column.data_type?.includes(
          "timestamp"
        ) &&
        value
      ){

        value =
          new Date(
            value
          ).toISOString();

      }

      payload[column.name] =
        value;

    });

  if(parseError){

    toast(
      parseError,
      true
    );

    return;

  }

  let result;

  if(editing){

    const primaryKeys =
      meta.primary_keys || [];

    if(!primaryKeys.length){

      toast(
        "Cannot update a table without a primary key.",
        true
      );

      return;

    }

    let query =
      sb
        .from(table)
        .update(payload);

    primaryKeys.forEach(key=>{

      query =
        query.eq(
          key,
          editing[key]
        );

    });

    result =
      await query;

  }else{

    result =
      await sb
        .from(table)
        .insert(payload);

  }

  if(result.error){

    toast(
      "Save failed: " +
      result.error.message,
      true
    );

    return;

  }

  await logActivity(
    editing
      ? "update"
      : "create",
    table,
    editing
      ? primaryKeyValue(
          meta,
          editing
        )
      : null
  );

  closeModal();

  toast(
    editing
      ? "Record updated successfully."
      : "Record created successfully."
  );

  await loadRows(table);

}


/* =========================================================
   PRIMARY KEY
========================================================= */

function primaryKeyValue(
  meta,
  row
){

  const keys =
    meta.primary_keys || [];

  if(!keys.length)
    return null;

  if(keys.length === 1)
    return row[keys[0]];

  return JSON.stringify(
    keys.reduce(
      (obj,key)=>{
        obj[key] =
          row[key];
        return obj;
      },
      {}
    )
  );

}


/* =========================================================
   DELETE
========================================================= */

function deleteByIndex(index){

  const row =
    currentDisplayRows[index];

  if(!row)
    return;

  deleteRow(row);

}


async function deleteRow(row){

  const table =
    currentTable;

  const meta =
    schema[table];

  if(!meta)
    return;

  const keys =
    meta.primary_keys || [];

  if(!keys.length){

    toast(
      "Cannot delete a table without a primary key.",
      true
    );

    return;

  }

  const confirmed =
    window.confirm(
      "Delete this record?\n\nThis cannot be undone."
    );

  if(!confirmed)
    return;

  let query =
    sb
      .from(table)
      .delete();

  keys.forEach(key=>{

    query =
      query.eq(
        key,
        row[key]
      );

  });

  const {
    error
  } =
    await query;

  if(error){

    toast(
      "Delete failed: " +
      error.message,
      true
    );

    return;

  }

  await logActivity(
    "delete",
    table,
    primaryKeyValue(
      meta,
      row
    )
  );

  toast(
    "Record deleted."
  );

  await loadRows(table);

}

        }

}

/* =========================================================
   CSV
========================================================= */

function exportCSV(){

  if(!currentRows.length){

    toast(
      "Nothing to export.",
      true
    );

    return;

  }

  const columns =
    Object.keys(
      currentRows[0]
    );

  const lines = [

    columns.join(","),

    ...currentRows.map(row=>

      columns
        .map(column=>{

          let value =
            row[column];

          if(
            typeof value === "object" &&
            value !== null
          ){

            value =
              JSON.stringify(value);

          }

          return `"${String(
            value ?? ""
          ).replace(
            /"/g,
            '""'
          )}"`;

        })
        .join(",")

    )

  ];

  const blob =
    new Blob(
      [
        lines.join("\n")
      ],
      {
        type:"text/csv"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    (
      currentTable ||
      "crowrules-export"
    ) +
    ".csv";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );

}


/* =========================================================
   MODAL / UI
========================================================= */

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("open");

  editing = null;

}


function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


function toast(
  message,
  error=false
){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.className =
    "toast show " +
    (
      error
        ? "err"
        : "ok"
    );

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      ()=>{
        el.className =
          "toast";
      },
      4000
    );

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const el =
    document.getElementById(
      "clock"
    );

  if(!el)
    return;

  el.textContent =
    new Date()
      .toLocaleString(
        undefined,
        {
          dateStyle:"medium",
          timeStyle:"medium"
        }
      );

}

document.addEventListener(
