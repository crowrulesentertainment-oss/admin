<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules V181 — Audit Explorer</title><style>body{margin:0;background:#08080d;color:#eee;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:28px}.hero,.card{background:#111119;border:1px solid #292936;border-radius:16px;padding:20px;margin-bottom:16px}.eyebrow{letter-spacing:3px;color:#aaa;font-size:11px}.title{font-size:30px;font-weight:800;margin:8px 0}.muted{color:#9999a7}.filters{display:flex;gap:10px;flex-wrap:wrap}select,input{background:#171720;color:#eee;border:1px solid #333340;border-radius:9px;padding:10px}button{background:#222230;color:#fff;border:1px solid #444;border-radius:9px;padding:10px 16px;cursor:pointer}.event{border-left:2px solid #555;padding:12px 16px;margin:10px 0;background:#15151d;border-radius:0 10px 10px 0}.type{font-size:11px;letter-spacing:1px}.meta{font-size:12px;color:#999;margin-top:5px}@media(max-width:700px){.filters>*{width:100%}}</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">CROWRULES • V181</div><div class="title">Recovery Incident Timeline & Audit Explorer</div><div class="muted">A chronological, searchable audit layer for recovery operations. Privileged tables remain protected.</div></section><section class="card"><div class="filters"><input id="incident" placeholder="Incident UUID (optional)"><select id="type"><option value="">All event types</option><option>incident_created</option><option>incident_updated</option><option>alert_created</option><option>recovery_event</option><option>automation_event</option><option>run_created</option><option>run_updated</option><option>scheduler_event</option></select><button id="load">Refresh Timeline</button></div></section><section class="card"><div id="status" class="muted">Loading…</div><div id="timeline"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const C=window.CROW_CONFIG||{},u=C.supabaseUrl||window.SUPABASE_URL,k=C.supabaseKey||window.SUPABASE_KEY;const db=u&&k?supabase.createClient(u,k):null;async function load(){const box=document.getElementById("timeline"),status=document.getElementById("status");box.innerHTML="";if(!db){status.textContent="Supabase configuration unavailable.";return}let q=db.from("system_recovery_audit_events").select("id,event_type,service_key,incident_id,recovery_run_id,message,metadata,created_at").order("created_at",{ascending:false}).limit(100);const i=document.getElementById("incident").value.trim(),t=document.getElementById("type").value;if(i)q=q.eq("incident_id",i);if(t)q=q.eq("event_type",t);const r=await q;if(r.error){status.textContent="Audit data is protected from this public client. Use an authorized admin surface.";return}status.textContent=r.data.length+" events";for(const e of r.data){const d=document.createElement("div");d.className="event";d.innerHTML="<div class='type'>"+e.event_type+"</div><strong>"+(e.message||"Recovery event")+"</strong><div class='meta'>"+new Date(e.created_at).toLocaleString()+" • "+(e.service_key||"system")+(e.incident_id?" • incident "+e.incident_id:"")+"</div>";box.appendChild(d)}}document.getElementById("load").onclick=load;load()})();</script></body></html>
